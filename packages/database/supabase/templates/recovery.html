<h2>Reset your password</h2>
<p>
  If you requested a password reset, use this link to choose a new password.
</p>
<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
    >Reset password</a
  >
</p>
<p>
  If you did not request this email, ignore it. Opening the link does not change
  your password.
</p>
