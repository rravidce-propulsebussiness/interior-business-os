name: BOQ cost integrity

on:
  push:
    paths:
      - 'apps/business-app/src/app/dashboard/execution/boq-*.ts'
      - 'apps/business-app/src/app/dashboard/execution/boq-*.tsx'
      - 'apps/business-app/src/app/dashboard/execution/boq-*.css'
      - '.github/workflows/boq-cost-integrity.yml'
      - 'vitest.config.ts'
      - 'packages/core/src/construction-boq.ts'
      - 'packages/core/src/construction-boq.test.ts'
  pull_request:
    paths:
      - 'apps/business-app/src/app/dashboard/execution/boq-*.ts'
      - 'apps/business-app/src/app/dashboard/execution/boq-*.tsx'
      - 'apps/business-app/src/app/dashboard/execution/boq-*.css'
      - '.github/workflows/boq-cost-integrity.yml'
      - 'vitest.config.ts'
      - 'packages/core/src/construction-boq.ts'
      - 'packages/core/src/construction-boq.test.ts'

permissions:
  contents: read

jobs:
  verify-boq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run every BOQ cost, takeoff, editor and workflow suite
        run: >-
          pnpm exec vitest run
          apps/business-app/src/app/dashboard/execution/boq-
          packages/core/src/construction-boq.test.ts
      - name: BOQ formatting
        run: >-
          pnpm exec prettier --check
          apps/business-app/src/app/dashboard/execution/boq-pricing.ts
          apps/business-app/src/app/dashboard/execution/boq-pricing.test.ts
          apps/business-app/src/app/dashboard/execution/boq-create-step.test.tsx
          apps/business-app/src/app/dashboard/execution/boq-project-workflow.test.ts
          apps/business-app/src/app/dashboard/execution/boq-labour.ts
          apps/business-app/src/app/dashboard/execution/boq-labour.test.ts
          apps/business-app/src/app/dashboard/execution/boq-project-costs.ts
          apps/business-app/src/app/dashboard/execution/boq-project-costs.test.ts
          apps/business-app/src/app/dashboard/execution/boq-scope-coverage.ts
          apps/business-app/src/app/dashboard/execution/boq-scope-coverage.test.ts
          apps/business-app/src/app/dashboard/execution/boq-actions.ts
          apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
          apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.tsx
          apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.test.tsx
          apps/business-app/src/app/dashboard/execution/boq-compact-fixes.css
          apps/business-app/src/app/dashboard/execution/boq-stage-measurements.ts
          apps/business-app/src/app/dashboard/execution/boq-stage-measurements.test.ts
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts
          apps/business-app/src/app/dashboard/execution/boq-wizard-flow.tsx
          apps/business-app/src/app/dashboard/execution/boq-wizard-flow.test.tsx
          apps/business-app/src/app/dashboard/execution/boq-plaster-guards.ts
          apps/business-app/src/app/dashboard/execution/boq-plaster-guards.test.ts
          packages/core/src/construction-boq.ts
          packages/core/src/construction-boq.test.ts
          vitest.config.ts
      - name: BOQ React and calculation lint
        run: >-
          pnpm exec eslint
          apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
          apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.tsx
          packages/core/src/construction-boq.ts
          --max-warnings=0
      - name: BOQ TypeScript integrity
        run: pnpm --filter ./apps/business-app typecheck
