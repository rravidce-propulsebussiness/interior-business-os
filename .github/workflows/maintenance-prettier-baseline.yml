name: Normalize existing Prettier baseline (maintenance only)
on:
  push:
    branches: [maintenance/prettier-baseline-20261027]
    paths:
      - '.github/workflows/maintenance-prettier-baseline.yml'
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run canonical repository formatter
        run: pnpm format
      - name: Stabilize the quotation studio CSS output
        run: pnpm exec prettier --write apps/business-app/src/app/dashboard/quotations/studio.css
      - name: Verify format and generated DB types match
        run: |
          pnpm format:check
          pnpm db:types:check
      - name: Commit formatting-only baseline to maintenance branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Normalize existing Prettier formatting debt"
            git push origin HEAD:refs/heads/maintenance/prettier-baseline-20261027
          fi
