name: Temporary integration formatter
on:
  push:
    branches:
      - integration/universal-os-foundation-20261010
    paths:
      - .github/workflows/once-format-integration.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/platform-admin/src/app/dashboard/organizations/page.tsx packages/database/src/repository.ts
      - name: Commit formatting (branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-admin/src/app/dashboard/organizations/page.tsx packages/database/src/repository.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(integration): format company directory with pinned Prettier"
            git push origin HEAD:integration/universal-os-foundation-20261010
          fi
