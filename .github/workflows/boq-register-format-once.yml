name: Format BOQ register feature
on:
  push:
    branches:
      - feat/boq-simple-register-20261122
    paths:
      - ".github/workflows/boq-register-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format BOQ register UI files
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-register-landing.tsx \
            apps/business-app/src/app/dashboard/execution/boq-register-landing.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-register-landing.css \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/layout.tsx
      - name: Commit formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format simplified register interface"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
