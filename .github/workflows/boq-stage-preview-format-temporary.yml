name: Temporary premium BOQ formatter
on:
  push:
    branches: [feat/boq-stage-preview]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.css
          apps/business-app/src/app/dashboard/execution/boq-wizard-flow.tsx
          apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.css apps/business-app/src/app/dashboard/execution/boq-wizard-flow.tsx apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(boq): format premium wizard'
            git push
          fi
