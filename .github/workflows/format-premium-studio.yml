name: Format premium studio preview
on:
  push:
    branches:
      - feature/premium-website-studio-global-shell-20261103
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: >
          npx --yes prettier@3.9.9 --write
          apps/business-app/src/app/dashboard/owner-shell.tsx
          apps/business-app/src/app/dashboard/owner-workspace-navigation.ts
          apps/business-app/src/app/dashboard/owner-shell-global.css
          apps/business-app/src/app/dashboard/website/page.tsx
          apps/business-app/src/app/dashboard/website/website-premium.tsx
          apps/business-app/src/app/dashboard/website/website-premium.css
          apps/business-app/src/app/dashboard/website/actions.ts
          apps/business-app/src/app/dashboard/website/entry-actions.ts
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/owner-shell.tsx apps/business-app/src/app/dashboard/owner-workspace-navigation.ts apps/business-app/src/app/dashboard/owner-shell-global.css apps/business-app/src/app/dashboard/website/page.tsx apps/business-app/src/app/dashboard/website/website-premium.tsx apps/business-app/src/app/dashboard/website/website-premium.css apps/business-app/src/app/dashboard/website/actions.ts apps/business-app/src/app/dashboard/website/entry-actions.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format premium Website Studio implementation"
            git push origin HEAD:feature/premium-website-studio-global-shell-20261103
          fi
