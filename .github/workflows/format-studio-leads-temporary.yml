name: Format Studio lead prefill
on:
  push:
    branches:
      - feature/premium-quotation-studio-20261013
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/quotations/new/page.tsx apps/business-app/src/app/dashboard/quotations/studio-start.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/business-app/src/app/dashboard/quotations/new/page.tsx apps/business-app/src/app/dashboard/quotations/studio-start.tsx
            git commit -m "style: format quotation lead prefill"
            git push origin HEAD:feature/premium-quotation-studio-20261013
          fi
