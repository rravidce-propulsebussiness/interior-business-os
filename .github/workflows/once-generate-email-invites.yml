name: One-time verified invite formatter and typegen
on:
  push:
    branches:
      - feature/phase2-verified-email-employee-invitations-20261010
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
      ALLOW_TEST_DATABASE_RESET: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-verified-email-employee-invitations-20261010
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/database/scripts/verify.mjs --initialize-only
      - run: pnpm db:types
      - run: |
          pnpm exec prettier --write apps/business-app/src/app/dashboard/company/team/page.tsx apps/business-app/src/app/dashboard/company/team/actions.ts apps/business-app/src/app/dashboard/company/invitations/page.tsx apps/business-app/src/app/dashboard/company/invitations/actions.ts apps/business-app/src/app/dashboard/page.tsx packages/database/src/repository.ts packages/shared/src/index.ts packages/database/src/generated/database.types.ts scripts/automation-worker.mjs packages/database/scripts/verify.mjs packages/database/scripts/test.mjs docs/EMAILS.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/company/team apps/business-app/src/app/dashboard/company/invitations apps/business-app/src/app/dashboard/page.tsx packages/database/src/repository.ts packages/shared/src/index.ts packages/database/src/generated/database.types.ts scripts/automation-worker.mjs packages/database/scripts/verify.mjs packages/database/scripts/test.mjs docs/EMAILS.md
          if ! git diff --cached --quiet; then
            git commit -m "style(types): regenerate invitation RPC types and format app integration"
            git push origin HEAD:feature/phase2-verified-email-employee-invitations-20261010
          fi
