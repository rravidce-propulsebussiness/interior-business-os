name: Format SFT final (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format SFT edit flow
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/dashboard/quotations/[id]/page.tsx' \
            'apps/business-app/src/app/dashboard/quotations/construction-selector.tsx' \
            'apps/business-app/src/app/dashboard/quotations/sft-estimate-builder.tsx' \
            'packages/core/src/quotation-document.ts'
      - name: Commit prettier result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/quotations packages/core/src/quotation-document.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(quotation): format SFT draft edit and PDF renderer'
            git push origin HEAD:${{ github.head_ref }}
          fi
