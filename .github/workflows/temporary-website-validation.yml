name: Temporary focused Website validation
on:
  push:
    branches:
      - feature/premium-website-dashboard-orange
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Website formatting
        run: |
          pnpm exec prettier --check \
            apps/business-app/src/app/dashboard/website/page.tsx \
            apps/business-app/src/app/dashboard/website/website-create.tsx \
            apps/business-app/src/app/dashboard/website/website-home.tsx \
            apps/business-app/src/app/dashboard/website/website-home.css
      - name: Lint Website files
        run: |
          pnpm exec eslint \
            apps/business-app/src/app/dashboard/website/page.tsx \
            apps/business-app/src/app/dashboard/website/website-create.tsx \
            apps/business-app/src/app/dashboard/website/website-home.tsx
      - name: Typecheck Business App
        run: pnpm --filter @business-os/business-app typecheck
      - name: Build Business App
        run: pnpm --filter @business-os/business-app build
