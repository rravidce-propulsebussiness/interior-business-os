name: BOQ incomplete rod and beam-count checks (temporary)
on:
  push:
    branches:
      - fix/boq-blank-steel-rows-beam-count-20261122
    paths:
      - .github/workflows/boq-draft-rods-verify-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boq-blank-steel-rows-beam-count-20261122
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format BOQ entry changes
        run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq-design-schedule.tsx apps/business-app/src/app/dashboard/execution/boq-beam-run-calculation.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-structural-entry-regression.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution/boq-design-schedule.tsx apps/business-app/src/app/dashboard/execution/boq-beam-run-calculation.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-structural-entry-regression.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format draft rod and beam-count changes"
            git push origin HEAD:refs/heads/fix/boq-blank-steel-rows-beam-count-20261122
          fi
      - name: Test structural entries and quantities
        run: pnpm exec vitest run apps/business-app/src/app/dashboard/execution/boq-structural-entry-regression.test.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.test.tsx
      - name: Business OS typecheck
        run: pnpm --filter @business-os/business-app typecheck
      - name: Strict lint
        run: pnpm lint
