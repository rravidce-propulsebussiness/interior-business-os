name: Format CRM Upload UX
on:
  push:
    branches:
      - feat/premium-crm-sheet-upload-google-paste-20261013
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[crm-upload-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/crm/leads/import/sheet-import-form.tsx \
            apps/business-app/src/app/dashboard/crm/leads/workspace.tsx \
            apps/business-app/src/app/dashboard/crm/leads/leads.css \
            scripts/crm-unified-workspace.test.mjs
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/crm/leads scripts/crm-unified-workspace.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format CRM upload UX [crm-upload-formatted]"
            git push origin HEAD:feat/premium-crm-sheet-upload-google-paste-20261013
          fi
