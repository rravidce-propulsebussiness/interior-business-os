name: BOQ final formatting and lint verification (temporary)
on:
  push:
    branches:
      - feat/boq-structural-multi-type-rebar-20261122
    paths:
      - .github/workflows/boq-structural-final-quality-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boq-structural-multi-type-rebar-20261122
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix structural BOQ formatting
        run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx
      - name: Commit formatting back to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format schedule editor after lint fixes"
            git push origin HEAD:refs/heads/feat/boq-structural-multi-type-rebar-20261122
          fi
      - name: Check structural BOQ formatting
        run: pnpm exec prettier --check apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx apps/business-app/src/app/dashboard/execution/boq-structural-design-schema.ts apps/business-app/src/app/dashboard/execution/boq-actions.ts
      - name: Lint all Business OS files
        run: pnpm lint
