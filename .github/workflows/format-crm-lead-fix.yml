name: Format CRM lead fix
on:
  push:
    branches:
      - fix/crm-lead-defaults-20261013
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/crm/leads/page.tsx apps/business-app/src/app/dashboard/crm/leads/quick-add-lead.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/business-app/src/app/dashboard/crm/leads/page.tsx apps/business-app/src/app/dashboard/crm/leads/quick-add-lead.tsx
            git commit -m "style: format CRM lead starter controls"
            git push origin HEAD:fix/crm-lead-defaults-20261013
          fi
