name: Format Separate Lead Import Pages
on:
  push:
    branches:
      - feat/crm-separate-upload-and-google-sheets-pages-20261013
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[lead-pages-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/crm/layout.tsx \
            apps/business-app/src/app/dashboard/crm/leads/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/workspace.tsx \
            apps/business-app/src/app/dashboard/crm/leads/leads.css \
            apps/business-app/src/app/dashboard/crm/leads/import/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/import/sheet-import-form.tsx \
            apps/business-app/src/app/dashboard/crm/leads/import-page-shell.tsx \
            apps/business-app/src/app/dashboard/crm/leads/upload/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/google-sheets/page.tsx \
            scripts/crm-unified-workspace.test.mjs \
            tests/e2e/crm.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/crm scripts/crm-unified-workspace.test.mjs tests/e2e/crm.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format separate lead import pages [lead-pages-formatted]"
            git push origin HEAD:feat/crm-separate-upload-and-google-sheets-pages-20261013
          fi
