name: Temporary interior timeline formatter
on:
  push:
    branches: [fix/interior-timeline-context-20261015]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and emit exact fragments
        run: |
          pnpm exec prettier --write 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-planning-panel.tsx'
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ["apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/construction-planning-panel.tsx"]) {
            const contents = fs.readFileSync(path,'utf8');
            const chunks = contents.match(/[\s\S]{1,650}/g) || [''];
            chunks.forEach((piece,i)=>process.stdout.write('FMTCHUNK|'+path+'|'+i+'|'+chunks.length+'|'+JSON.stringify(piece)+'\n'));
          }
          NODE
