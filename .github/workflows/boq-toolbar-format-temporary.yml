name: Temporary BOQ toolbar formatter
on:
  push:
    branches: [fix/boq-aligned-editor-toolbars]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.css apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.css apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(boq): format aligned editor toolbars'
            git push
          fi
