name: Temporary BOQ footing repair and formatting
on:
  push:
    branches: [fix/boq-reinforcement-and-mix-specifications]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped footing and metric fixes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          changes = json.loads("[[\"packages/core/src/construction-boq.ts\",\"export const DESIGN_SETTING_KEYS = [\",\"export const DESIGN_SETTING_KEYS = [\\n  'stockBarFeet',\"],[\"apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx\",\"              footings={drawing.footings ?? []}\",\"              footings={drawing.footings ?? []}\\n              coverMm={drawing.settings?.coverFootingMm || drawing.settings?.coverMm || props.structuralSettings.coverFootingMm || props.structuralSettings.coverMm}\\n              stockFeet={drawing.settings?.stockBarFeet ?? props.structuralSettings.stockBarFeet}\\n              onCoverChange={(value) => setSetting('coverFootingMm', value)}\\n              onStockChange={(value) => setSetting('stockBarFeet', value)}\"],[\"apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx\",\"<th>Thickness (in)</th>\",\"<th>Thickness ({editorUnit('in', dimensionUnit).unit})</th>\"],[\"apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx\",\"label={wall.name + ' thickness'}\\n                              value={wall.thicknessIn}\\n                              onChange={(thicknessIn) =>\\n                                update({ thicknessIn })\\n                              }\",\"key={'thickness' + dimensionUnit}\\n                              label={wall.name + ' thickness (' + editorUnit('in', dimensionUnit).unit + ')'}\\n                              value={Number((wall.thicknessIn * editorUnit('in', dimensionUnit).factor).toFixed(6))}\\n                              onChange={(value) => update({ thicknessIn: value / editorUnit('in', dimensionUnit).factor })}\"],[\"apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx\",\"return kind === 'quote-window-sajjas' || isAutoPlasterQuantity(kind, name);\",\"return kind === 'quote-window-sajjas' || isAutoPlasterQuantity(kind, name) || name === 'Binding wire' || (kind === 'quote-footings' && /\\\\bTMT\\\\b/.test(name));\"],[\"apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx\",\"<small>{entry.line.name}</small>\",\"<small>{entry.line.name}</small>\\n                            {entry.line.kind === 'quote-footings' && entry.output.material === 'steel' && entry.output.source && <small>{entry.output.source}</small>}\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"  unitControl?: ReactNode;\",\"  unitControl?: ReactNode;\\n  coverMm?: number;\\n  stockFeet?: number;\\n  onCoverChange?: (value: number) => void;\\n  onStockChange?: (value: number) => void;\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"  min = 0,\\n}: {\",\"  min = 0,\\n  max,\\n}: {\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"  min?: number;\",\"  min?: number;\\n  max?: number;\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"        min={min * display.factor}\",\"        min={min * display.factor}\\n        max={max === undefined ? undefined : max * display.factor}\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"  unitControl,\\n}: Props)\",\"  unitControl,\\n  coverMm,\\n  stockFeet,\\n  onCoverChange,\\n  onStockChange,\\n}: Props)\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"      {footings.map((f, fi) => {\",\"      {onCoverChange && onStockChange && (\\n        <div className=\\\"boq-stage-input-grid\\\">\\n          <Numeric label=\\\"Footing concrete cover\\\" unit=\\\"mm\\\" value={coverMm ?? 50} min={50} max={75} onChange={onCoverChange} />\\n          <Numeric label=\\\"Stock rod length (project)\\\" unit=\\\"ft\\\" value={stockFeet ?? 40} min={20} max={60} onChange={onStockChange} />\\n        </div>\\n      )}\\n      {footings.map((f, fi) => {\"],[\"apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx\",\"(f.bottomBendIn || 6)\",\"(f.bottomBendIn || 12)\"],[\"apps/business-app/src/app/dashboard/execution/boq-workspace.tsx\",\"const lockedPlaster = isAutoPlasterQuantity(line.kind, output.name);\",\"const lockedPlaster = isAutoPlasterQuantity(line.kind, output.name);\\n        const lockedSteel = line.kind === 'quote-footings' && output.material === 'steel';\"],[\"apps/business-app/src/app/dashboard/execution/boq-workspace.tsx\",\"edit.quantity !== undefined && !lockedPlaster\",\"edit.quantity !== undefined && !lockedPlaster && !lockedSteel\"],[\"apps/business-app/src/app/dashboard/execution/boq-workspace.tsx\",\"    if (\\n      target?.origin &&\\n      output &&\\n      isAutoPlasterQuantity(target.kind, output.name)\\n    )\",\"    if (\\n      output && (output.name === 'Binding wire' ||\\n        (target?.origin && (isAutoPlasterQuantity(target.kind, output.name) ||\\n          (target.kind === 'quote-footings' && output.material === 'steel'))))\\n    )\"],[\"apps/business-app/src/app/dashboard/execution/boq-workspace.tsx\",\"concreteSettings.stockBarFeet)} : line)\",\"result.settings.stockBarFeet)} : line)\"],[\"apps/business-app/src/app/dashboard/execution/boq-workspace.tsx\",\"const BOQ_ENGINE_VERSION = 4;\",\"const BOQ_ENGINE_VERSION = 4;\"],[\"apps/business-app/src/app/dashboard/execution/boq-cost-summary.test.ts\",\"import { fillingOutput }\",\"import { editorUnit } from './boq-compact-editor';\\nimport { withMeasuredBindingWire } from './boq-binding-wire';\\nimport { fillingOutput }\"]]")
          appends = json.loads("[[\"packages/core/src/construction-boq.test.ts\",\"describe('drawing-specific footing bends and stock cuts', () => {\\n  const footing = { ...newFootingType(0), count: 12, lengthFeet: 5, widthFeet: 5, thicknessIn: 24, bottomBarDia: 12, bottomSpacingIn: 6, bottomBendIn: 12 };\\n  it('counts 264 pieces and 53 stock rods for the 12-pad schedule', () => {\\n    const mesh = footingMeshPieces(footing, 50 / 304.8);\\n    expect(mesh.reduce((sum, row) => sum + row.pieces, 0)).toBe(264);\\n    expect(mesh[0]?.lengthFeet).toBeCloseTo(6.671916, 5);\\n    const result = generateQuotationBoq({\\n      details: quote(), settings: { coverFootingMm: 50, stockBarFeet: 40 },\\n      design: { footings: [footing], columns: [], beams: [], plinthRunFeet: 0, settings: { stockBarFeet: 40 } },\\n      splitBeamSlab: true,\\n    });\\n    expect(result.lines.find(line => line.kind === 'quote-footings')?.outputs.find(output => output.diameter === 12)?.quantity).toBe(53);\\n    expect(result.design?.footings[0]?.bottomBendIn).toBe(12);\\n    expect(result.design?.settings?.stockBarFeet).toBe(40);\\n  });\\n  it('does not infer bend length from footing depth after the drawing value is entered', () => {\\n    const straight = footingMeshPieces({ ...footing, bottomBendIn: 0 }, 50 / 304.8);\\n    const bent = footingMeshPieces(footing, 50 / 304.8);\\n    expect(straight[0]?.lengthFeet).toBeCloseTo(4.671916, 5);\\n    expect(bent).toEqual(footingMeshPieces({ ...footing, thicknessIn: 36 }, 50 / 304.8));\\n  });\\n});\"],[\"apps/business-app/src/app/dashboard/execution/boq-cost-summary.test.ts\",\"describe('structural units and binding wire', () => {\\n  it('converts millimetres back to saved inches', () => {\\n    const view = editorUnit('in', 'm');\\n    expect(view.unit).toBe('mm');\\n    expect(6 * view.factor).toBeCloseTo(152.4);\\n    expect(304.8 / view.factor).toBeCloseTo(12);\\n    expect(editorUnit('in', 'ft')).toEqual({ unit: 'in', factor: 1 });\\n    expect(editorUnit('mm', 'm')).toEqual({ unit: 'mm', factor: 1 });\\n  });\\n  it('adds binding wire only once for measured reinforcement', () => {\\n    const outputs = [{ name: '12 mm TMT', material: 'steel', quantity: 53, unit: 'rod', weightKg: 570, rods: 53 }];\\n    const result = withMeasuredBindingWire(outputs, 8, 40);\\n    expect(result.find(output => output.material === 'binding_wire')?.quantity).toBe(4.6);\\n    expect(withMeasuredBindingWire(result, 8, 40)).toEqual(result);\\n  });\\n});\"]]")
          for name, old, new in changes:
              path = Path(name)
              source = path.read_text()
              if old == new:
                  continue
              if source.count(old) != 1:
                  raise RuntimeError(f"Expected exactly one anchor in {name}: {old[:80]}")
              path.write_text(source.replace(old, new, 1))
          for name, addition in appends:
              path = Path(name)
              path.write_text(path.read_text() + "\n" + addition + "\n")
          
          PY
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/construction-boq.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-cost-summary.test.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-binding-wire.ts apps/business-app/src/app/dashboard/execution/boq-compact-editor.tsx apps/business-app/src/app/dashboard/execution/boq-pricing.ts apps/business-app/src/app/dashboard/execution/boq-structural-concrete-card.tsx packages/core/src/footing-takeoff.ts
      - name: Commit reviewed source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/construction-boq.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-cost-summary.test.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-binding-wire.ts apps/business-app/src/app/dashboard/execution/boq-compact-editor.tsx apps/business-app/src/app/dashboard/execution/boq-pricing.ts apps/business-app/src/app/dashboard/execution/boq-structural-concrete-card.tsx packages/core/src/footing-takeoff.ts
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(boq): finish footing controls, metric fields and regression coverage'
            git push
          fi
