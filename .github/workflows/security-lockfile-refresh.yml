name: Refresh patched dependency lockfile

on:
  push:
    branches:
      - feat/reusable-rcc-floor-slabs-20261024
    paths:
      - '.github/workflows/security-lockfile-refresh.yml'
      - 'package.json'
      - 'apps/**/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.ref_name == 'feat/reusable-rcc-floor-slabs-20261024'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Re-resolve patched packages and all transitive integrity hashes
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen lockfile is installable
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m 'chore(security): lock patched Next.js and Zod dependencies'
            git push origin HEAD:feat/reusable-rcc-floor-slabs-20261024
          fi
      - name: Security audit after lockfile regeneration
        run: pnpm audit --audit-level high
