name: Temporary autosave Prettier fix
on:
  push:
    branches:
      - fix/workflow-toolbar-autosave-20261118
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'Format workflow autosave files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed workflow files
        run: |
          pnpm exec prettier --write apps/business-app/src/app/dashboard/settings/construction-payment-defaults.tsx apps/business-app/src/app/dashboard/settings/settings.css apps/business-app/src/app/dashboard/settings/workflow-autosave.test.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/settings/construction-payment-defaults.tsx apps/business-app/src/app/dashboard/settings/settings.css apps/business-app/src/app/dashboard/settings/workflow-autosave.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format workflow autosave files'
            git push origin HEAD:fix/workflow-toolbar-autosave-20261118
          fi
