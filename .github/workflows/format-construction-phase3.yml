name: Temporary Phase 3 formatting
on:
  push:
    branches:
      - feature/construction-execution-os-phase3-agreement-gates-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase3-agreement-gates-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed Phase 3 UI and docs
        run: pnpm exec prettier --write "apps/business-app/src/app/dashboard/projects/[id]/site/agreement-actions.ts" "apps/business-app/src/app/dashboard/projects/[id]/site/agreement-readiness-panel.tsx" "apps/business-app/src/app/dashboard/projects/[id]/site/page.tsx" "docs/CONSTRUCTION-EXECUTION-OS-PHASE3.md" "packages/database/src/generated/database.types.ts"
      - name: Commit formatting on isolated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/projects docs/CONSTRUCTION-EXECUTION-OS-PHASE3.md packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format Phase 3 changes"
            git push origin HEAD:feature/construction-execution-os-phase3-agreement-gates-20261014
          fi
