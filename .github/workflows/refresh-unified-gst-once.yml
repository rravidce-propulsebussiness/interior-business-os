name: Refresh Unified GST (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify SQL and generate types
        run: |
          pnpm db:verify
          pnpm db:types
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - name: Format touched source
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/admin/control/billing/template-actions.ts \
            apps/business-app/src/app/admin/control/billing/template-studio.tsx \
            apps/business-app/src/app/admin/control/billing/page.tsx \
            apps/business-app/src/app/dashboard/billing/actions.ts \
            apps/business-app/src/app/dashboard/billing/document-editor.tsx \
            apps/business-app/src/app/dashboard/billing/new/page.tsx \
            apps/business-app/src/app/dashboard/billing/page.tsx \
            apps/business-app/src/app/dashboard/billing/gst-reports/page.tsx \
            apps/business-app/src/app/dashboard/billing/gst-reports/export/route.ts \
            apps/business-app/src/app/dashboard/billing/gst-reports/filing-csv.ts \
            apps/business-app/src/app/dashboard/billing/gst-reports/filing-csv.test.ts \
            packages/database/src/gst-templates.ts
      - name: Commit generated types and source formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/admin/control/billing apps/business-app/src/app/dashboard/billing packages/database/src/gst-templates.ts packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(gst): regenerate schema types and format unified reporting'
            git push origin HEAD:${{ github.head_ref }}
          fi
