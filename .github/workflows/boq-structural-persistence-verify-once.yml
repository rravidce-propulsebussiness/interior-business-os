name: Structural BOQ save schema verification (temporary)
on:
  push:
    branches:
      - feat/boq-structural-multi-type-rebar-20261122
    paths:
      - .github/workflows/boq-structural-persistence-verify-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boq-structural-multi-type-rebar-20261122
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format persistence schema
        run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-structural-design-schema.ts apps/business-app/src/app/dashboard/execution/boq-structural-design-schema.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-structural-design-schema.ts apps/business-app/src/app/dashboard/execution/boq-structural-design-schema.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format save schema round-trip tests"
            git push origin HEAD:refs/heads/feat/boq-structural-multi-type-rebar-20261122
          fi
      - name: Run structural persistence and quantity tests
        run: pnpm exec vitest run apps/business-app/src/app/dashboard/execution/boq-structural-design-schema.test.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-stage-measurements.test.ts apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.test.tsx
      - name: Typecheck Business OS
        run: pnpm --filter @business-os/business-app typecheck
