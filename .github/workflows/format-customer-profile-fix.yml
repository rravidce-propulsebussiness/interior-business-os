name: Format customer profile fix
on:
  push:
    branches:
      - fix/customer-profile-remove-duplicate-navigation
    paths:
      - .github/workflows/format-customer-profile-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format customer profile changes
        run: >-
          pnpm exec prettier --write
          'apps/business-app/src/app/dashboard/customers/[id]/page.tsx'
          'apps/business-app/src/app/dashboard/customers/[id]/customer-profile.css'
          'apps/business-app/src/app/dashboard/customers/[id]/customer-profile.test.ts'
      - name: Commit formatting
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/business-app/src/app/dashboard/customers/
          if ! git diff --cached --quiet; then
            git commit -m "Format customer profile cleanup"
            git push origin HEAD:fix/customer-profile-remove-duplicate-navigation
          fi
