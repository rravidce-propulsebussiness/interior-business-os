name: Temporary owner onboarding formatter
on:
  push:
    branches:
      - feature/organization-first-owner-password-20261011
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format owner onboarding files
        run: |
          pnpm exec prettier --write \
            packages/database/src/server.ts \
            packages/database/src/platform-companies.ts \
            packages/database/src/generated/database.types.ts \
            apps/business-app/src/app/admin/organizations/control-actions.ts \
            apps/business-app/src/app/admin/organizations/owner-organization-form.tsx \
            apps/business-app/src/app/admin/organizations/create/page.tsx \
            apps/business-app/src/app/admin/organizations/page.tsx \
            apps/business-app/src/app/admin/organizations/[id]/page.tsx \
            apps/business-app/src/app/admin/users/create/page.tsx \
            apps/business-app/src/app/admin/users/[id]/page.tsx \
            docs/ORGANIZATION-OWNER-ONBOARDING.md
      - name: Push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src apps/business-app/src/app/admin/organizations apps/business-app/src/app/admin/users docs/ORGANIZATION-OWNER-ONBOARDING.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format owner onboarding and directory"
            git push
          fi
