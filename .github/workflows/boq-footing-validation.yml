name: Footing / column BOQ validation (temporary)
on:
  push:
    branches: [feat/boq-separate-footing-column-design-20261122]
    paths:
      - .github/workflows/boq-footing-validation.yml
      - packages/core/src/construction-boq.ts
      - apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
      - apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
permissions:
  contents: write
jobs:
  footing-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boq-separate-footing-column-design-20261122
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed footing files
        run: |
          pnpm exec prettier --write \
            packages/core/src/footing-takeoff.ts \
            packages/core/src/construction-boq.ts \
            packages/core/src/construction-boq.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-actions.ts \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.css
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/core/src/footing-takeoff.ts packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.css
            git commit -m "style(boq): format independent foundation editor"
            git push origin HEAD:feat/boq-separate-footing-column-design-20261122
          fi
      - name: Structural BOQ tests
        run: pnpm exec vitest run packages/core/src/construction-boq.test.ts
      - name: Business OS typecheck
        run: pnpm --filter @business-os/business-app typecheck
