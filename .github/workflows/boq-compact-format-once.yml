name: Format compact BOQ branch once (temporary)
on:
  push:
    branches:
      - fix/boq-compact-stage-ui-ground-compound-penthouse-20261122
    paths:
      - .github/workflows/boq-compact-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boq-compact-stage-ui-ground-compound-penthouse-20261122
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format compact BOQ changes
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-compact-fixes.css \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.tsx \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.test.tsx \
            apps/business-app/src/app/dashboard/execution/layout.tsx
      - name: Commit formatting to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution/
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format compact BOQ workflow"
            git push origin HEAD:refs/heads/fix/boq-compact-stage-ui-ground-compound-penthouse-20261122
          fi
