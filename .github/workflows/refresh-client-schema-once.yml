name: Refresh database types once
on:
  push:
    branches:
      - feature/premium-client-command-dashboard-20261015
    paths:
      - .github/workflows/refresh-client-schema-once.yml
permissions:
  contents: write
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
      ALLOW_TEST_DATABASE_RESET: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/premium-client-command-dashboard-20261015
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify --initialize-only
      - run: pnpm db:types
      - run: pnpm db:types:check
      - name: Commit generated types to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate database types from migrations"
            git push origin HEAD:feature/premium-client-command-dashboard-20261015
          fi
