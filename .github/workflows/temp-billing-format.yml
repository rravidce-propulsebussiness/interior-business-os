name: Format GST billing details
on:
  push:
    branches:
      - feat/trading-billing-gst-invoices
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trading-billing-gst-invoices
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/billing
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/billing
          if ! git diff --cached --quiet; then
            git commit -m 'style(billing): format invoice page after JSX escaping'
            git push origin HEAD:feat/trading-billing-gst-invoices
          fi
