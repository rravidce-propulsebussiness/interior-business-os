name: Temporary numeric-floor test formatting
on:
  push:
    branches:
      - feature/quote-driven-construction-handoff-20261015
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print formatted unit test fragments
        run: |
          pnpm exec prettier --write 'packages/core/src/quote-construction-handoff.test.ts'
          node <<'NODE'
          const fs=require('node:fs');
          const path='packages/core/src/quote-construction-handoff.test.ts';
          const parts=(fs.readFileSync(path,'utf8').match(/[\s\S]{1,500}/g)||['']);
          parts.forEach((piece,i)=>process.stdout.write('FMTCHUNK|'+path+'|'+i+'|'+parts.length+'|'+JSON.stringify(piece)+'\n'));
          NODE
