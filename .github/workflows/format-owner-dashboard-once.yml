name: Format owner dashboard (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/single-company-owner-dashboard-20261011' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format modified owner files
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/dashboard/page.tsx' \
            'apps/business-app/src/app/dashboard/owner-shell.tsx' \
            'apps/business-app/src/app/dashboard/owner-dashboard.css' \
            'apps/business-app/src/app/dashboard/company/settings/page.tsx' \
            'apps/business-app/src/app/dashboard/quotations/new/page.tsx'
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/page.tsx apps/business-app/src/app/dashboard/owner-shell.tsx apps/business-app/src/app/dashboard/owner-dashboard.css apps/business-app/src/app/dashboard/company/settings/page.tsx apps/business-app/src/app/dashboard/quotations/new/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(owner): format single-company dashboard'
            git push origin HEAD:${{ github.head_ref }}
          fi
