name: Format construction specification PR (temporary)
on:
  push:
    branches:
      - feat/editable-construction-package-spec-fields-20261014
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editable-construction-package-spec-fields-20261014
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the branch and remove temporary workflow
        run: |
          pnpm exec prettier --write .
          rm .github/workflows/temporary-format-spec-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'style: format configurable construction specification fields'
          git push origin HEAD:feat/editable-construction-package-spec-fields-20261014
