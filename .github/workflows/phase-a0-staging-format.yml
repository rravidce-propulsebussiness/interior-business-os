name: Phase A0 one-time staging Auth formatting
on:
  push:
    branches:
      - style/phase-a0-staging-auth-format-20261010
    paths:
      - .github/workflows/phase-a0-staging-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only two concurrent staging Auth files
        run: pnpm exec prettier --write docs/TEST-USERS-STAGING.md packages/database/scripts/provision-test-auth-users.mjs
      - name: Confirm both files are formatted
        run: pnpm exec prettier --check docs/TEST-USERS-STAGING.md packages/database/scripts/provision-test-auth-users.mjs
      - name: Commit exactly two format-only changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/TEST-USERS-STAGING.md packages/database/scripts/provision-test-auth-users.mjs
          git commit -m "style(staging): format concurrent Auth provisioning documents"
          git push origin HEAD:style/phase-a0-staging-auth-format-20261010
