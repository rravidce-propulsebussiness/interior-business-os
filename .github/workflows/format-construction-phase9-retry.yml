name: Temporary Phase 9 retry formatting
on:
  push:
    branches:
      - feature/construction-phase9-labor-idempotency-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-phase9-labor-idempotency-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only new worker attendance UI changes
        run: pnpm exec prettier --write "apps/business-app/src/app/dashboard/projects/[id]/site/construction-gate-actions.ts" "apps/business-app/src/app/dashboard/projects/[id]/site/construction-gate-panel.tsx"
      - name: Commit lockfile-compatible formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/business-app/src/app/dashboard/projects/[id]/site/construction-gate-actions.ts" "apps/business-app/src/app/dashboard/projects/[id]/site/construction-gate-panel.tsx"
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format idempotent gate actions"
            git push origin HEAD:feature/construction-phase9-labor-idempotency-20261014
          fi
