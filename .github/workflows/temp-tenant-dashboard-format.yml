name: Format tenant dashboard draft
on:
  push:
    branches:
      - fix/replace-legacy-tenant-dashboard-20261010
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/replace-legacy-tenant-dashboard-20261010
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/page.tsx apps/business-app/src/app/globals.css
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/page.tsx apps/business-app/src/app/globals.css
          if ! git diff --cached --quiet; then
            git commit -m 'style: format premium tenant dashboard'
            git push origin HEAD:fix/replace-legacy-tenant-dashboard-20261010
          fi
