name: Format two-step BOQ feature
on:
  push:
    branches:
      - feat/boq-two-step-create-20261122
    paths:
      - ".github/workflows/boq-two-step-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier changed BOQ files
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-create-step.tsx \
            apps/business-app/src/app/dashboard/execution/boq-create-step.css \
            apps/business-app/src/app/dashboard/execution/boq-create-step.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-labour-panel.tsx \
            apps/business-app/src/app/dashboard/execution/layout.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format two-step creation and autosave"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
