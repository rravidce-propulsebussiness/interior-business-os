name: Projects CSS format verification
on:
  push:
    branches: [feat/premium-projects-dashboard-20261013]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify then normalize CSS
        run: |
          pnpm exec prettier --check apps/business-app/src/app/dashboard/projects/projects-dashboard.css || true
          pnpm exec prettier --write apps/business-app/src/app/dashboard/projects/projects-dashboard.css
          pnpm exec prettier --check apps/business-app/src/app/dashboard/projects/projects-dashboard.css
          git diff --stat -- apps/business-app/src/app/dashboard/projects/projects-dashboard.css
      - name: Commit normalized CSS
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/business-app/src/app/dashboard/projects/projects-dashboard.css
          if ! git diff --cached --quiet; then
            git commit -m "Normalize premium projects CSS per CI"
            git push origin HEAD:feat/premium-projects-dashboard-20261013
          fi
