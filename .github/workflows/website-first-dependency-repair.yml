name: Website-first dependency patch (feature branch only)
on:
  push:
    branches: [feature/website-first-growth-scale-20261027]
    paths:
      - '.github/workflows/website-first-dependency-repair.yml'
      - 'pnpm-lock.yaml'
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/feature/website-first-growth-scale-20261027' && github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Apply patched versions and regenerate lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm --recursive update next@16.4.1 eslint-config-next@16.4.1 zod@4.6.6 --save-exact
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level=high
      - name: Commit dependency-only repair to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json apps/*/package.json packages/*/package.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "Patch Next.js and Zod security advisories"
            git push origin HEAD:refs/heads/feature/website-first-growth-scale-20261027
          fi
