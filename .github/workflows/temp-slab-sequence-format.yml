name: Temporary Slab Sequence Prettier
on:
  push:
    branches:
      - feat/slab-stage-sequence-20261118
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'Format slab workflow and tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository Prettier on slab workflow files
        run: pnpm exec prettier --write packages/core/src/slab-workflow.ts packages/core/src/slab-workflow.test.ts packages/core/src/company-construction-defaults.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/slab-workflow.ts packages/core/src/slab-workflow.test.ts packages/core/src/company-construction-defaults.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format slab workflow and tests'
            git push origin HEAD:feat/slab-stage-sequence-20261118
          fi
