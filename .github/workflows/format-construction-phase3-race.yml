name: Temporary Phase 3 race test format
on:
  push:
    branches:
      - feature/construction-execution-os-phase3-agreement-gates-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase3-agreement-gates-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the pinned repository formatter
        run: pnpm exec prettier --write packages/database/src/operations-concurrency.integration.test.ts
      - name: Commit only targeted test formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/operations-concurrency.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format signed-agreement concurrency fixture"
            git push origin HEAD:feature/construction-execution-os-phase3-agreement-gates-20261014
          fi
