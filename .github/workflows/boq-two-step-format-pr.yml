name: Format BOQ two-step PR once
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/boq-two-step-format-pr.yml"]
permissions:
  contents: write
jobs:
  formatter:
    if: github.event.pull_request.head.ref == 'feat/boq-two-step-create-20261122' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq-create-step.test.tsx apps/business-app/src/app/dashboard/execution/boq-create-step.tsx apps/business-app/src/app/dashboard/execution/boq-labour-panel.tsx apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): apply Prettier to two-step creation"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
