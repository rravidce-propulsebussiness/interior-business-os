name: Format GST Studio (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier touched files
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/admin/dashboard.css \
            apps/business-app/src/app/admin/control/billing/page.tsx \
            apps/business-app/src/app/admin/control/billing/template-actions.ts \
            apps/business-app/src/app/admin/control/billing/template-studio.tsx \
            apps/business-app/src/app/dashboard/billing/page.tsx \
            apps/business-app/src/app/dashboard/billing/new/page.tsx \
            apps/business-app/src/app/dashboard/billing/actions.ts \
            apps/business-app/src/app/dashboard/billing/document-editor.tsx \
            'apps/business-app/src/app/dashboard/billing/[id]/page.tsx' \
            packages/database/src/gst-templates.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/admin/dashboard.css apps/business-app/src/app/admin/control/billing apps/business-app/src/app/dashboard/billing packages/database/src/gst-templates.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(gst): format template studio'
            git push origin HEAD:${{ github.head_ref }}
          fi
