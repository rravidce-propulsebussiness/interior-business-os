name: One-time BOQ project Final fallback format and types
on:
  push:
    branches:
      - fix/boq-latest-quote-default-final-20261121
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boq-latest-quote-default-final-20261121
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify --initialize-only
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - run: pnpm db:types
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq/page.tsx apps/business-app/src/app/dashboard/execution/boq-project-quote.ts apps/business-app/src/app/dashboard/execution/boq-project-quote.test.ts apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-quotation.ts apps/business-app/src/app/dashboard/execution/boq-project-eligibility.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-project-workflow.test.ts packages/database/src/generated/database.types.ts
      - name: Commit formatting and generated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/business-app/src/app/dashboard/execution/boq/page.tsx apps/business-app/src/app/dashboard/execution/boq-project-quote.ts apps/business-app/src/app/dashboard/execution/boq-project-quote.test.ts apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-quotation.ts apps/business-app/src/app/dashboard/execution/boq-project-eligibility.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-project-workflow.test.ts packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format BOQ latest Final quote workflow and generated DB types"
            git push origin HEAD:fix/boq-latest-quote-default-final-20261121
          fi
