name: Format membership plans (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format touched source only
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/admin/dashboard.css \
            apps/business-app/src/app/admin/plans/page.tsx \
            apps/business-app/src/app/admin/plans/actions.ts \
            apps/business-app/src/app/admin/plans/plans-workspace.tsx
      - name: Commit formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/admin/dashboard.css apps/business-app/src/app/admin/plans
          if ! git diff --cached --quiet; then
            git commit -m 'style(admin): format premium membership plans'
            git push origin HEAD:${{ github.head_ref }}
          fi
