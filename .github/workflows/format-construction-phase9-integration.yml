name: Temporary Phase 9 integration formatting
on:
  push:
    branches:
      - feature/construction-execution-os-phase9-integration-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase9-integration-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply locked Prettier to Phase 9 architecture document
        run: pnpm exec prettier --write docs/CONSTRUCTION-EXECUTION-OS-PHASE9-INTEGRATION.md
      - name: Commit formatting on isolated integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONSTRUCTION-EXECUTION-OS-PHASE9-INTEGRATION.md
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format Phase 9 integration documentation"
            git push origin HEAD:feature/construction-execution-os-phase9-integration-20261014
          fi
