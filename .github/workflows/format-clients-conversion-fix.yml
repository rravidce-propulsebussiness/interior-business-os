name: Format Clients conversion changes
on:
  push:
    branches:
      - feature/client-directory-won-lead-conversion
    paths:
      - .github/workflows/format-clients-conversion-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Clients and conversion changes
        run: >-
          pnpm exec prettier --write
          apps/business-app/src/app/dashboard/customers/page.tsx
          apps/business-app/src/app/dashboard/customers/clients-directory.css
          'apps/business-app/src/app/dashboard/customers/[id]/page.tsx'
          'apps/business-app/src/app/dashboard/customers/[id]/client-profile-light.css'
          'apps/business-app/src/app/dashboard/crm/leads/[id]/page.tsx'
          'apps/business-app/src/app/dashboard/crm/leads/[id]/convert/page.tsx'
          apps/business-app/src/app/dashboard/crm/actions.ts
          apps/business-app/src/app/dashboard/crm/leads/propulse-actions.ts
          packages/database/src/crm-sharing.integration.test.ts
      - name: Commit formatting
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/business-app/src/app/dashboard/customers/ apps/business-app/src/app/dashboard/crm/ packages/database/src/crm-sharing.integration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Clients and won-only conversion implementation"
            git push origin HEAD:feature/client-directory-won-lead-conversion
          fi
