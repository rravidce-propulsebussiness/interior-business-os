name: Temporary format capture for construction PR
on:
  push:
    branches:
      - feature/construction-visual-timeline-site-evidence-20261015
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source and emit temporary source fragments
        run: |
          pnpm exec prettier --write 'apps/business-app/src/app/dashboard/projects/[id]/page.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/page.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/forms.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/command-overview.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.css' 'docs/CONSTRUCTION-SITE-TIMELINE.md'
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ["apps/business-app/src/app/dashboard/projects/[id]/page.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/page.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/forms.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/command-overview.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.css","docs/CONSTRUCTION-SITE-TIMELINE.md"]) {
            const contents = fs.readFileSync(path, 'utf8');
            const parts = contents.match(/[\s\S]{1,600}/g) || [''];
            for (let i = 0; i < parts.length; i++) {
              process.stdout.write('FMTCHUNK|' + path + '|' + i + '|' + parts.length + '|' + JSON.stringify(parts[i]) + '\n');
            }
          }
          NODE
