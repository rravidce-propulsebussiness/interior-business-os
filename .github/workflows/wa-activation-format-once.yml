name: Format WhatsApp Calling activation (one-time)
on:
  push:
    branches: [fix/wa-calling-not-set-activation]
    paths:
      - .github/workflows/wa-activation-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/lib/whatsapp-calling-status.ts
          apps/business-app/src/lib/whatsapp-calling-status.test.ts
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          docs/WHATSAPP-CLOUD-API.md
      - run: |
          if ! git diff --quiet -- apps/business-app/src/lib/whatsapp-calling-status.ts apps/business-app/src/lib/whatsapp-calling-status.test.ts apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx docs/WHATSAPP-CLOUD-API.md; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add apps/business-app/src/lib/whatsapp-calling-status.ts apps/business-app/src/lib/whatsapp-calling-status.test.ts apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx docs/WHATSAPP-CLOUD-API.md
            git commit -m "Format WhatsApp Calling NOT SET activation fix"
            git push origin HEAD:fix/wa-calling-not-set-activation
          fi
