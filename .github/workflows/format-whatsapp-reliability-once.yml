name: Format WhatsApp reliability changes (one time)
on:
  push:
    branches:
      - fix/whatsapp-calling-reliability-nov08
    paths:
      - .github/workflows/format-whatsapp-reliability-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/lib/whatsapp-turn.ts
          apps/business-app/src/lib/whatsapp-turn.test.ts
          apps/business-app/src/lib/whatsapp-calling-events.ts
          apps/business-app/src/lib/whatsapp-calling-events.test.ts
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          tests/chromium/live.spec.ts
          docs/WHATSAPP-CLOUD-API.md
      - name: Commit formatted changes
        run: |
          if ! git diff --quiet -- apps/business-app/src/lib/whatsapp-turn.ts apps/business-app/src/lib/whatsapp-turn.test.ts apps/business-app/src/lib/whatsapp-calling-events.ts apps/business-app/src/lib/whatsapp-calling-events.test.ts apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx tests/chromium/live.spec.ts docs/WHATSAPP-CLOUD-API.md; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add apps/business-app/src/lib/whatsapp-turn.ts apps/business-app/src/lib/whatsapp-turn.test.ts apps/business-app/src/lib/whatsapp-calling-events.ts apps/business-app/src/lib/whatsapp-calling-events.test.ts apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx tests/chromium/live.spec.ts docs/WHATSAPP-CLOUD-API.md
            git commit -m "Format WhatsApp Calling reliability fixes"
            git push origin HEAD:fix/whatsapp-calling-reliability-nov08
          fi
