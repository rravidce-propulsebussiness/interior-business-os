name: Temporary project detail formatter
on:
  push:
    branches:
      - feat/premium-project-detail-dashboard-20261013
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format project detail files
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/dashboard/projects/[id]/page.tsx' \
            'apps/business-app/src/app/dashboard/projects/[id]/project-detail.css' \
            'apps/business-app/src/app/dashboard/projects/project-workspace-navigation.ts' \
            'apps/business-app/src/app/dashboard/projects/page.tsx'
      - name: Commit formatting
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- 'apps/business-app/src/app/dashboard/projects/[id]/page.tsx' \
            'apps/business-app/src/app/dashboard/projects/[id]/project-detail.css' \
            'apps/business-app/src/app/dashboard/projects/project-workspace-navigation.ts' \
            'apps/business-app/src/app/dashboard/projects/page.tsx'
          if ! git diff --cached --quiet; then
            git commit -m "Format premium project detail components"
            git push origin HEAD:feat/premium-project-detail-dashboard-20261013
          fi
