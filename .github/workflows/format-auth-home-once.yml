name: Format authenticated home redirect (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'fix/home-auto-redirect-authenticated-20261012' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/page.tsx' \
            'apps/business-app/src/app/dashboard/owner-shell.tsx' \
            'apps/business-app/src/app/admin/dashboard-shell.tsx' \
            'tests/e2e/live-auth.spec.ts'
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/page.tsx apps/business-app/src/app/dashboard/owner-shell.tsx apps/business-app/src/app/admin/dashboard-shell.tsx tests/e2e/live-auth.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(auth): format automatic home redirect'
            git push origin HEAD:${{ github.head_ref }}
          fi
