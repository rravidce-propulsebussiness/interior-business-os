name: Format and generate ProPulse CRM types
on:
  push:
    branches:
      - feat/unified-crm-propulse-pair-sync-20261013
permissions:
  contents: write
jobs:
  format-and-types:
    if: "!contains(github.event.head_commit.message, '[crm-formatted]')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
      ALLOW_TEST_DATABASE_RESET: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify --initialize-only
      - run: pnpm db:types
      - run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/crm/leads/propulse-actions.ts \
            apps/business-app/src/app/dashboard/crm/leads/propulse-connect-panel.tsx \
            apps/business-app/src/app/dashboard/crm/leads/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/workspace.tsx \
            apps/business-app/src/app/dashboard/crm/leads/leads.css \
            apps/business-app/src/app/dashboard/crm/leads/import/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/propulse/page.tsx
      - name: Commit generated types and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/crm/leads packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format CRM and refresh schema types [crm-formatted]"
            git push origin HEAD:feat/unified-crm-propulse-pair-sync-20261013
          fi
