name: Format ProPulse settings
on:
  push:
    branches:
      - feature/propulse-company-owner-sync-20261013
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/company/settings/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add apps/business-app/src/app/dashboard/company/settings/page.tsx
            git commit -m "style: format ProPulse company settings"
            git push origin HEAD:feature/propulse-company-owner-sync-20261013
          fi
