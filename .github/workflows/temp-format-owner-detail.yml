name: Temporary format owner detail
on:
  push:
    branches:
      - feature/organization-first-owner-password-20261011
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/admin/users/[id]/page.tsx apps/business-app/src/app/admin/organizations/page.tsx
      - name: Commit Prettier changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/admin/users/[id]/page.tsx apps/business-app/src/app/admin/organizations/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format owner details and cards"
            git push
          fi
