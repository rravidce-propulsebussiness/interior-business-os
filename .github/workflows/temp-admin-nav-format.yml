name: Format admin navigation draft
on:
  push:
    branches:
      - fix/admin-canonical-dashboard-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-canonical-dashboard-20261010
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prettier --write docs/HOSTINGER-DEPLOYMENT.md
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HOSTINGER-DEPLOYMENT.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: format canonical dashboard deployment guide'
            git push origin HEAD:fix/admin-canonical-dashboard-20261010
          fi
