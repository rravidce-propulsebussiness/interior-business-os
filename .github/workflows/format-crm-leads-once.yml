name: Format CRM Leads (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/premium-crm-leads-20261012' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed CRM files
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/dashboard/crm/leads/page.tsx' \
            'apps/business-app/src/app/dashboard/crm/leads/workspace.tsx' \
            'apps/business-app/src/app/dashboard/crm/leads/leads.css' \
            'apps/business-app/src/app/dashboard/crm/layout.tsx' \
            'apps/business-app/src/app/dashboard/owner-shell.tsx'
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/crm/leads/page.tsx apps/business-app/src/app/dashboard/crm/leads/workspace.tsx apps/business-app/src/app/dashboard/crm/leads/leads.css apps/business-app/src/app/dashboard/crm/layout.tsx apps/business-app/src/app/dashboard/owner-shell.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(crm): format premium Leads workspace'
            git push origin HEAD:${{ github.head_ref }}
          fi
