name: Format Hostinger Startup Hotfix
on:
  push:
    branches:
      - hotfix/hostinger-503-remove-top-level-await-20261013
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[hostinger-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write server.js scripts/client-asset-integrity.mjs scripts/client-asset-integrity.test.mjs
      - name: Commit formatted hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js scripts/client-asset-integrity.mjs scripts/client-asset-integrity.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format Hostinger startup hotfix [hostinger-formatted]"
            git push origin HEAD:hotfix/hostinger-503-remove-top-level-await-20261013
          fi
