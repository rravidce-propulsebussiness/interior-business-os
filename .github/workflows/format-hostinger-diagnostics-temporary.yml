name: Format Hostinger Diagnostics Draft
on:
  push:
    branches:
      - fix/admin-access-diagnostics-and-favicon-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/api/admin-access/route.ts apps/business-app/src/app/favicon.ico/route.ts apps/business-app/src/app/icon.svg apps/business-app/src/proxy.ts docs/HOSTINGER-DEPLOYMENT.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/business-app/src/app/api/admin-access/route.ts apps/business-app/src/app/favicon.ico/route.ts apps/business-app/src/app/icon.svg apps/business-app/src/proxy.ts docs/HOSTINGER-DEPLOYMENT.md
          if ! git diff --cached --quiet; then
            git commit -m "style(business-os): format hostinger diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
