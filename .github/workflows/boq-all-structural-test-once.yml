name: BOQ multi structural verification (temporary)
on:
  push:
    branches:
      - feat/boq-structural-multi-type-rebar-20261122
    paths:
      - .github/workflows/boq-all-structural-test-once.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boq-structural-multi-type-rebar-20261122
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format updated structural schedules
        run: |
          pnpm exec prettier --write \
            packages/core/src/construction-boq.ts \
            packages/core/src/construction-boq.test.ts \
            packages/core/src/footing-takeoff.ts \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.css \
            apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx \
            apps/business-app/src/app/dashboard/execution/boq-design-schedule.tsx \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx \
            apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.test.tsx
      - name: Commit formatting to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts packages/core/src/footing-takeoff.ts apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.css apps/business-app/src/app/dashboard/execution/boq-footing-editor.tsx apps/business-app/src/app/dashboard/execution/boq-design-schedule.tsx apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.tsx apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format multi-type structural schedules"
            git push origin HEAD:refs/heads/feat/boq-structural-multi-type-rebar-20261122
          fi
      - name: Test structural takeoff and schedule UI
        run: pnpm exec vitest run packages/core/src/construction-boq.test.ts packages/core/src/footing-takeoff.test.ts apps/business-app/src/app/dashboard/execution/boq-structural-schedule-editors.test.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts
      - name: Typecheck Business OS
        run: pnpm --filter @business-os/business-app typecheck

# Reverify after TypeScript and UI import corrections.
