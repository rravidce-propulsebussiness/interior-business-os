name: BOQ split final formatter temporary
on:
  push:
    branches: [feat/boq-stage-cards-20261121]
    paths: [.github/workflows/boq-split-format.yml]
permissions: {contents: write}
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/boq-stage-cards-20261121
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed code and test
        run: |
          pnpm exec prettier --write packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
            git commit -m "style(boq): format separate beam slab takeoff"
            git push origin HEAD:feat/boq-stage-cards-20261121
          fi
