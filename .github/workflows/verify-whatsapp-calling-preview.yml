name: Verify WhatsApp Calling Preview
on:
  push:
    branches:
      - feature/whatsapp-voice-calling
    paths:
      - .github/workflows/verify-whatsapp-calling-preview.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --check
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          apps/business-app/src/app/dashboard/whatsapp/hub.tsx
          apps/business-app/src/lib/whatsapp-meta-error.ts
          docs/WHATSAPP-CLOUD-API.md
      - run: >-
          pnpm exec eslint
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          apps/business-app/src/app/dashboard/whatsapp/hub.tsx
          apps/business-app/src/lib/whatsapp-meta-error.ts
          --max-warnings=0
      - run: >-
          pnpm exec vitest run
          apps/business-app/src/lib/whatsapp-fixes.test.ts
          apps/business-app/src/lib/whatsapp-origin.test.ts
      - run: pnpm --filter ./apps/business-app build
