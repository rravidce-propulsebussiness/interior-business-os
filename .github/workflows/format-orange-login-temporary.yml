name: Format orange login (temporary)
on:
  push:
    branches:
      - design/premium-orange-login-20261024
    paths:
      - 'apps/business-app/src/app/login/page.tsx'
      - 'apps/business-app/src/app/login/premium-login.css'
      - '.github/workflows/format-orange-login-temporary.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/login/page.tsx apps/business-app/src/app/login/premium-login.css
      - name: Remove temporary workflow and commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-orange-login-temporary.yml
          git add apps/business-app/src/app/login/page.tsx apps/business-app/src/app/login/premium-login.css
          git commit -m "Format premium orange login and remove temporary workflow"
          git push origin HEAD:design/premium-orange-login-20261024
