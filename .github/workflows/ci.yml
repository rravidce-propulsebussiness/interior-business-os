name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/automation-email.test.mjs scripts/hostinger-deployment.test.mjs scripts/client-asset-integrity.test.mjs scripts/crm-unified-workspace.test.mjs scripts/lead-date-range.test.mjs
      - run: pnpm test:acceptance
      - run: pnpm security:dependency
      - run: pnpm exec vitest run packages/core/src/quotation-document.test.ts packages/core/src/quotation-stage-requirements.test.ts packages/core/src/quotation-milestone-flow.test.ts packages/core/src/company-construction-defaults.test.ts apps/business-app/src/app/dashboard/projects/project-stage-unified.test.ts apps/business-app/src/app/dashboard/projects/project-item-schedule.test.ts packages/core/src/quotation-payment-plan.test.ts packages/core/src/construction-payment-schedule.test.ts packages/core/src/quote-construction-handoff.test.ts packages/core/src/sft-quotation.test.ts packages/shared/src/quotation-pdf-fallback.test.ts packages/shared/src/pdf.test.ts apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.test.ts apps/business-app/src/app/dashboard/quotations/studio-ui.test.ts apps/business-app/src/app/dashboard/crm/settings/requirement-fields.test.ts apps/business-app/src/app/dashboard/quotations/quotation-terms-format.test.ts apps/business-app/src/app/dashboard/quotations/construction-floor-inheritance.test.ts apps/business-app/src/app/dashboard/quotations/penthouse-floor-selection.test.ts apps/business-app/src/app/dashboard/quotations/pdf-renderer.test.ts
      - run: pnpm db:verify && pnpm db:types:check && pnpm db:seed:check && pnpm exec vitest run packages/database/src/catalog.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:recovery
      - run: pnpm check
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
