name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose package field formatting
        run: |
          pnpm exec prettier --write "apps/business-app/src/app/dashboard/pricing/construction/package-actions.ts" "apps/business-app/src/app/dashboard/pricing/construction/packages/[id]/preview/route.ts" "apps/business-app/src/app/dashboard/pricing/construction/premium-package-editor.tsx" "apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx" "packages/core/src/package-custom-fields.test.ts" "packages/core/src/quotation-document.ts" "packages/core/src/sft-quotation.ts" "packages/database/src/construction-packages.ts"
          git diff -- "apps/business-app/src/app/dashboard/pricing/construction/package-actions.ts" "apps/business-app/src/app/dashboard/pricing/construction/packages/[id]/preview/route.ts" "apps/business-app/src/app/dashboard/pricing/construction/premium-package-editor.tsx" "apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx" "packages/core/src/package-custom-fields.test.ts" "packages/core/src/quotation-document.ts" "packages/core/src/sft-quotation.ts" "packages/database/src/construction-packages.ts"
      - run: node --test scripts/automation-email.test.mjs scripts/hostinger-deployment.test.mjs scripts/client-asset-integrity.test.mjs scripts/crm-unified-workspace.test.mjs
      - run: pnpm test:acceptance
      - run: pnpm security:dependency
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm db:verify && pnpm db:types:check && pnpm db:seed:check && pnpm exec vitest run packages/database/src/catalog.integration.test.ts
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:recovery
      - run: pnpm check
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
