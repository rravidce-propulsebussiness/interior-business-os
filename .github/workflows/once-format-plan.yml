name: Temporary Phase 1 subscription format/typegen
on:
  push:
    branches: [feature/phase1-company-approval-20261010]
    paths: [.github/workflows/once-format-plan.yml]
permissions:
  contents: write
jobs:
  format-types:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
      ALLOW_TEST_DATABASE_RESET: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify --initialize-only
      - run: pnpm db:types
      - run: pnpm exec prettier --write apps/platform-admin/src/app/dashboard/plans/page.tsx apps/platform-admin/src/app/dashboard/plans/actions.ts apps/platform-admin/src/app/dashboard/page.tsx packages/database/src/repository.ts packages/database/src/generated/database.types.ts
      - name: Commit normalized sources and regenerated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-admin/src/app/dashboard/plans apps/platform-admin/src/app/dashboard/page.tsx packages/database/src/repository.ts packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(phase1): normalize plan UI and generated SQL types"
            git push origin HEAD:feature/phase1-company-approval-20261010
          fi
