name: Prepare quotation package builder (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify DB and regenerate types
        run: |
          pnpm db:verify
          pnpm db:types
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/admin/control/quotations/page.tsx' \
            'apps/business-app/src/app/admin/control/quotations/error.tsx' \
            'apps/business-app/src/app/dashboard/pricing/construction/package-actions.ts' \
            'apps/business-app/src/app/dashboard/pricing/construction/package-manager.tsx' \
            'apps/business-app/src/app/dashboard/pricing/construction/page.tsx' \
            'apps/business-app/src/app/dashboard/quotations/settings/page.tsx' \
            'apps/business-app/src/app/dashboard/quotations/[id]/page.tsx' \
            'apps/business-app/src/app/dashboard/quotations/construction-actions.ts' \
            'apps/business-app/src/app/dashboard/quotations/construction-selector.tsx' \
            'packages/database/src/construction-packages.ts' \
            'packages/core/src/quotation-document.ts' \
            'packages/core/src/quotation-document.test.ts'
      - name: Commit formatting and generated types
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/admin/control/quotations apps/business-app/src/app/dashboard/pricing/construction apps/business-app/src/app/dashboard/quotations packages/core/src/quotation-document.ts packages/core/src/quotation-document.test.ts packages/database/src/construction-packages.ts packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore(quotation): format dual-mode builder and regenerate DB types'
            git push origin HEAD:${{ github.head_ref }}
          fi
