name: Temporary Phase 1 format and generated types
# Format from the current feature head after concurrent authored changes.
on:
  push:
    branches:
      - feature/phase1-company-approval-20261010
    paths:
      - .github/workflows/once-format-phase1.yml
permissions:
  contents: write
jobs:
  format-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
      ALLOW_TEST_DATABASE_RESET: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify --initialize-only
      - run: pnpm db:types
      - name: Format all Phase 1 TypeScript
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/page.tsx \
            apps/business-app/src/app/dashboard/company/apply/page.tsx \
            apps/business-app/src/app/dashboard/company/apply/actions.ts \
            apps/platform-admin/src/app/dashboard/applications/page.tsx \
            apps/platform-admin/src/app/dashboard/applications/actions.ts \
            packages/database/src/repository.ts \
            packages/database/src/generated/database.types.ts \
            packages/database/scripts/verify.mjs \
            packages/database/scripts/test.mjs
      - name: Commit format and generated types (feature branch only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard apps/platform-admin/src/app/dashboard/applications packages/database/src/repository.ts packages/database/src/generated/database.types.ts packages/database/scripts/verify.mjs packages/database/scripts/test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style(phase1): regenerate RPC types and format application code"
            git push origin HEAD:feature/phase1-company-approval-20261010
          fi
