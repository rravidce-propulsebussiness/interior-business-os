name: Temporary onboarding-gate formatting
on:
  push:
    branches: [feature/phase1-company-approval-20261010]
    paths: [.github/workflows/once-format-onboarding-gate.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/platform-admin/src/app/dashboard/applications/page.tsx apps/platform-admin/src/app/dashboard/applications/actions.ts packages/database/src/repository.ts packages/database/src/generated/database.types.ts apps/business-app/src/app/dashboard/actions.ts
      - name: Commit normalizations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform-admin/src/app/dashboard/applications apps/business-app/src/app/dashboard/actions.ts packages/database/src/repository.ts packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(phase1): normalize approval enforcement interface"
            git push origin HEAD:feature/phase1-company-approval-20261010
          fi
