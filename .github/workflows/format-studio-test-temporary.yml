name: Format studio tests (temporary)
on:
  push:
    branches:
      - feature/premium-quotation-studio-20261013
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/shared/src/pdf-annexures.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add packages/shared/src/pdf-annexures.test.ts
            git commit -m "style: format PDF annexure tests"
            git push origin HEAD:feature/premium-quotation-studio-20261013
          fi
