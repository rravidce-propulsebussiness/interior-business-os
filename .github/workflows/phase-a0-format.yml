name: Phase A0 one-time baseline formatting

on:
  push:
    branches:
      - fix/phase-a0-dependency-security-20261010
    paths:
      - .github/workflows/phase-a0-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only 15 files reported by Foundation checks
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/page.tsx \
            apps/business-app/src/app/forgot-password/page.tsx \
            apps/business-app/src/app/globals.css \
            apps/business-app/src/app/login/page.tsx \
            apps/business-app/src/app/page.tsx \
            apps/business-app/src/app/register/page.tsx \
            apps/business-app/src/app/reset-password/page.tsx \
            apps/business-app/tsconfig.json \
            apps/business-app/wrangler.jsonc \
            packages/database/src/proxy.ts \
            packages/shared/src/media.ts \
            packages/shared/src/pdf.ts \
            scripts/hostinger-build.mjs \
            scripts/hostinger-postinstall.mjs \
            server.js
      - name: Format two new specification documents
        run: pnpm exec prettier --write docs/PHASE-A0-DEPENDENCY-REPAIR.md docs/PHASE-B-COMPANY-ACCESS-SPEC.md
      - name: Verify full-repository formatting (no ignored files)
        run: pnpm format:check
      - name: Commit only mechanical formatting on feature branch
        run: |
          if git diff --quiet; then
            echo "No format changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/business-app/src/app/dashboard/page.tsx \
            apps/business-app/src/app/forgot-password/page.tsx \
            apps/business-app/src/app/globals.css \
            apps/business-app/src/app/login/page.tsx \
            apps/business-app/src/app/page.tsx \
            apps/business-app/src/app/register/page.tsx \
            apps/business-app/src/app/reset-password/page.tsx \
            apps/business-app/tsconfig.json \
            apps/business-app/wrangler.jsonc \
            packages/database/src/proxy.ts \
            packages/shared/src/media.ts \
            packages/shared/src/pdf.ts \
            scripts/hostinger-build.mjs \
            scripts/hostinger-postinstall.mjs \
            server.js
          git add -- docs/PHASE-A0-DEPENDENCY-REPAIR.md docs/PHASE-B-COMPANY-ACCESS-SPEC.md
          git diff --cached --exit-code && exit 0 || true
          git commit -m "style: apply pinned Prettier to pre-existing CI formatting failures"
          git push origin HEAD:fix/phase-a0-dependency-security-20261010
