name: Format Next deployment fix (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format implementation
        run: |
          pnpm exec prettier --write \
            'scripts/hostinger-deployment.mjs' \
            'scripts/hostinger-deployment.test.mjs' \
            'scripts/hostinger-build.mjs' \
            'server.js' \
            'apps/business-app/next.config.ts' \
            'docs/HOSTINGER-DEPLOYMENT.md' \
            '.github/workflows/ci.yml'
      - name: Commit formatted code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/hostinger-deployment.mjs scripts/hostinger-deployment.test.mjs scripts/hostinger-build.mjs server.js apps/business-app/next.config.ts docs/HOSTINGER-DEPLOYMENT.md .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style(hostinger): format Next deployment protection'
            git push origin HEAD:${{ github.head_ref }}
          fi
