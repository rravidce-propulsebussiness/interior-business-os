name: One-time migration-lag guard formatter
on:
  push:
    branches:
      - fix/phase2-unapplied-invitation-migration-guard-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase2-unapplied-invitation-migration-guard-20261010
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/database/src/repository.ts apps/business-app/src/app/dashboard/company/team/page.tsx apps/business-app/src/app/dashboard/company/invitations/page.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/repository.ts apps/business-app/src/app/dashboard/company/team/page.tsx apps/business-app/src/app/dashboard/company/invitations/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(release): format invitation migration-compatibility changes"
            git push origin HEAD:fix/phase2-unapplied-invitation-migration-guard-20261010
          fi
