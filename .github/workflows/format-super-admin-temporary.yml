name: Format Super Admin draft
on:
  push:
    branches:
      - feat/super-admin-dashboard-reconciled-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier only to new platform dashboard files
        run: |
          pnpm exec prettier --write \
            apps/platform-admin/src/app/dashboard/dashboard-shell.tsx \
            apps/platform-admin/src/app/dashboard/dashboard.css \
            apps/platform-admin/src/app/dashboard/domains/page.tsx \
            'apps/platform-admin/src/app/dashboard/control/[module]/page.tsx' \
            apps/platform-admin/src/app/dashboard/layout.tsx \
            apps/platform-admin/src/app/dashboard/page.tsx
      - name: Commit formatting when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/platform-admin/src/app/dashboard/dashboard-shell.tsx \
            apps/platform-admin/src/app/dashboard/dashboard.css \
            apps/platform-admin/src/app/dashboard/domains/page.tsx \
            'apps/platform-admin/src/app/dashboard/control/[module]/page.tsx' \
            apps/platform-admin/src/app/dashboard/layout.tsx \
            apps/platform-admin/src/app/dashboard/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(platform): format Super Admin implementation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
