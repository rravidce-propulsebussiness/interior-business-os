name: Temporary Phase 7 schema types and formatting
on:
  push:
    branches:
      - feature/construction-execution-os-phase7-client-updates-20261014
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase7-client-updates-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate RPC types from disposable DB
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
        run: |
          node packages/database/scripts/verify.mjs --initialize-only
          pnpm db:types
      - name: Format new portal and touched files
        run: pnpm exec prettier --write "apps/business-app/src/app/dashboard/projects/[id]/site/construction-client-actions.ts" "apps/business-app/src/app/dashboard/projects/[id]/site/construction-client-portal-panel.tsx" "apps/business-app/src/app/dashboard/projects/[id]/site/page.tsx" "apps/business-app/src/app/p/[token]/route.ts" "packages/database/src/generated/database.types.ts" "docs/CONSTRUCTION-EXECUTION-OS-PHASE7.md"
      - name: Commit generated types and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/projects apps/business-app/src/app/p packages/database/src/generated/database.types.ts docs/CONSTRUCTION-EXECUTION-OS-PHASE7.md
          if ! git diff --cached --quiet; then
            git commit -m "build(construction): regenerate client progress RPC types and format portal"
            git push origin HEAD:feature/construction-execution-os-phase7-client-updates-20261014
          fi
