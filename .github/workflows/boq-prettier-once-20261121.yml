name: One-time format BOQ pull request
on:
  push:
    branches:
      - fix/quotation-boq-manual-parity-20261121
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier to changed BOQ files and remove this temporary workflow
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-calculations.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx \
            packages/core/src/construction-boq.test.ts \
            packages/core/src/construction-boq.ts \
            packages/core/src/sft-quotation.ts
          rm .github/workflows/boq-prettier-once-20261121.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: format quotation and BOQ implementation'
          git push origin HEAD:fix/quotation-boq-manual-parity-20261121
