name: Temporary Phase 2 formatting
on:
  push:
    branches:
      - feature/construction-execution-os-phase2-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase2-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 2 TypeScript and documentation
        run: pnpm exec prettier --write "apps/business-app/src/app/dashboard/projects/[id]/site/construction-actions.ts" "apps/business-app/src/app/dashboard/projects/[id]/site/construction-planning-panel.tsx" "apps/business-app/src/app/dashboard/projects/[id]/site/page.tsx" docs/CONSTRUCTION-EXECUTION-OS-PHASE2.md packages/database/src/generated/database.types.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/projects docs/CONSTRUCTION-EXECUTION-OS-PHASE2.md packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): apply repository formatter to Phase 2"
            git push origin HEAD:feature/construction-execution-os-phase2-20261014
          fi
