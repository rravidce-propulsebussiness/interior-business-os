name: Format WhatsApp Calling Preview
on:
  push:
    branches:
      - feature/whatsapp-voice-calling
    paths:
      - .github/workflows/format-whatsapp-calling-preview.yml
permissions:
  contents: write
jobs:
  format-only-preview:
    if: github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          apps/business-app/src/app/dashboard/whatsapp/hub.tsx
          apps/business-app/src/lib/whatsapp-meta-error.ts
          docs/WHATSAPP-CLOUD-API.md
      - name: Commit formatting on preview branch only
        run: |
          if ! git diff --quiet -- apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx apps/business-app/src/app/dashboard/whatsapp/hub.tsx apps/business-app/src/lib/whatsapp-meta-error.ts docs/WHATSAPP-CLOUD-API.md; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx apps/business-app/src/app/dashboard/whatsapp/hub.tsx apps/business-app/src/lib/whatsapp-meta-error.ts docs/WHATSAPP-CLOUD-API.md
            git commit -m "Format WhatsApp calling preview"
            git push origin HEAD:feature/whatsapp-voice-calling
          fi
