name: Temporary audit markdown formatter
on:
  push:
    branches: [integration/universal-os-foundation-20261010]
    paths: [.github/workflows/once-format-audit.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/UNIVERSAL-BUSINESS-OS-AUDIT-20261010.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UNIVERSAL-BUSINESS-OS-AUDIT-20261010.md
          if ! git diff --cached --quiet; then
            git commit -m "style(integration): format universal OS audit markdown"
            git push origin HEAD:integration/universal-os-foundation-20261010
          fi
