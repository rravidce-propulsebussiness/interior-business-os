name: Format structural RMC feature once
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/boq-rmc-prettier-once.yml"]
permissions:
  contents: write
jobs:
  prettier:
    if: github.event.pull_request.head.ref == 'feat/boq-structural-rmc-switch-20261122' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format BOQ concrete files
        run: |
          pnpm exec prettier --write \
            packages/core/src/construction-boq.ts \
            packages/core/src/construction-boq.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-stage-measurements.ts \
            apps/business-app/src/app/dashboard/execution/boq-stage-measurements.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-structural-concrete-card.tsx \
            apps/business-app/src/app/dashboard/execution/boq-structural-concrete-card.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-structural-concrete-card.css \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-actions.ts \
            apps/business-app/src/app/dashboard/execution/boq-export.ts \
            apps/business-app/src/app/dashboard/execution/boq-export.test.ts \
            apps/business-app/src/app/dashboard/execution/layout.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format RMC switch and concrete costing"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
