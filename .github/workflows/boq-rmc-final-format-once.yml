name: Final BOQ RMC formatting pass
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/boq-rmc-final-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/boq-structural-rmc-switch-20261122' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-stage-measurements.ts \
            apps/business-app/src/app/dashboard/execution/boq-stage-measurements.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-export.ts \
            apps/business-app/src/app/dashboard/execution/boq-export.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format final RMC compatibility updates"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
