name: Construction foundation one-time formatting
on:
  push:
    branches:
      - feature/construction-execution-os-foundation-20261014
permissions:
  contents: write
jobs:
  format-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-foundation-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format branch-only foundation files
        run: pnpm exec prettier --write packages/core/src/construction-workflow.ts packages/core/src/construction-workflow.test.ts docs/CONSTRUCTION-EXECUTION-OS-ARCHITECTURE.md
      - name: Commit formatted files to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/construction-workflow.ts packages/core/src/construction-workflow.test.ts docs/CONSTRUCTION-EXECUTION-OS-ARCHITECTURE.md
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format foundation files"
            git push origin HEAD:feature/construction-execution-os-foundation-20261014
          fi
