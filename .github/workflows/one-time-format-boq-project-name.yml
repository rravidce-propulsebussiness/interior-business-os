name: One-time formatting for BOQ and Won project names
on:
  push:
    branches:
      - fix/boq-project-visibility-won-lead-names-20261121
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boq-project-visibility-won-lead-names-20261121
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/crm/leads/lead-project-actions.ts apps/business-app/src/app/dashboard/crm/leads/lead-project-naming.test.ts apps/business-app/src/app/dashboard/billing/stage-invoice.test.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-project-eligibility.ts apps/business-app/src/app/dashboard/execution/boq-project-eligibility.test.ts apps/business-app/src/app/dashboard/execution/boq-project-workflow.test.ts
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/business-app/src/app/dashboard/crm/leads/lead-project-actions.ts apps/business-app/src/app/dashboard/crm/leads/lead-project-naming.test.ts apps/business-app/src/app/dashboard/billing/stage-invoice.test.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-project-eligibility.ts apps/business-app/src/app/dashboard/execution/boq-project-eligibility.test.ts apps/business-app/src/app/dashboard/execution/boq-project-workflow.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format BOQ project picker and lead naming tests"
            git push origin HEAD:fix/boq-project-visibility-won-lead-names-20261121
          fi
