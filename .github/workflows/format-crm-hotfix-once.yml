name: Format CRM Hotfix
on:
  push:
    branches:
      - fix/inline-crm-actions-static-chunks-20261013
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[crm-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format feature files
        run: |
          pnpm exec prettier --write \
            .github/workflows/ci.yml \
            apps/business-app/src/app/dashboard/crm/leads/workspace.tsx \
            apps/business-app/src/app/dashboard/crm/leads/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/new/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/import/actions.ts \
            apps/business-app/src/app/dashboard/crm/leads/leads.css \
            apps/business-app/src/app/dashboard/crm/leads/quick-add-action.ts \
            apps/business-app/src/app/dashboard/crm/leads/quick-add-lead.tsx \
            scripts/hostinger-build.mjs \
            scripts/client-asset-integrity.mjs \
            scripts/client-asset-integrity.test.mjs \
            scripts/crm-unified-workspace.test.mjs \
            server.js
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml apps/business-app/src/app/dashboard/crm/leads scripts server.js
          if ! git diff --cached --quiet; then
            git commit -m "Format unified CRM hotfix [crm-formatted]"
            git push origin HEAD:fix/inline-crm-actions-static-chunks-20261013
          fi
