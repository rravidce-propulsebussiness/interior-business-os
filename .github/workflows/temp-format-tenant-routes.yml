name: Temporary tenant routing formatter
on:
  push:
    branches:
      - feature/tenant-path-and-custom-host-dashboards-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format tenant routing source
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/workspace-paths.ts \
            apps/business-app/src/workspace-paths.test.ts \
            apps/business-app/src/proxy.ts \
            apps/business-app/src/app/dashboard/page.tsx \
            packages/database/src/proxy.ts \
            packages/auth/src/actions.ts \
            packages/auth/src/server.ts \
            packages/database/src/generated/database.types.ts \
            docs/TENANT-WORKSPACE-URLS.md \
            vitest.config.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/business-app/src/workspace-paths.ts \
            apps/business-app/src/workspace-paths.test.ts \
            apps/business-app/src/proxy.ts \
            apps/business-app/src/app/dashboard/page.tsx \
            packages/database/src/proxy.ts \
            packages/auth/src/actions.ts \
            packages/auth/src/server.ts \
            packages/database/src/generated/database.types.ts \
            docs/TENANT-WORKSPACE-URLS.md \
            vitest.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format tenant workspace routes"
            git push
          fi
