name: Format lead category fix
on:
  push:
    branches:
      - fix/crm-lead-service-category-identity
    paths:
      - .github/workflows/format-lead-category-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format CRM lead category files
        run: >-
          pnpm exec prettier --write
          'apps/business-app/src/app/dashboard/crm/leads/[id]/lead-category-actions.ts'
          'apps/business-app/src/app/dashboard/crm/leads/[id]/lead-category-editor.tsx'
          'apps/business-app/src/app/dashboard/crm/leads/[id]/page.tsx'
          apps/business-app/src/app/dashboard/crm/leads/lead-category.css
          apps/business-app/src/app/dashboard/crm/leads/lead-category.test.ts
          apps/business-app/src/app/dashboard/crm/leads/lead-category.ts
          apps/business-app/src/app/dashboard/crm/leads/page.tsx
          apps/business-app/src/app/dashboard/crm/leads/workspace.tsx
          apps/business-app/src/app/dashboard/crm/leads/board-view.tsx
      - name: Commit formatted files
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/business-app/src/app/dashboard/crm/leads/
          if ! git diff --cached --quiet; then
            git commit -m "Format CRM lead category UI and actions"
            git push origin HEAD:fix/crm-lead-service-category-identity
          fi
