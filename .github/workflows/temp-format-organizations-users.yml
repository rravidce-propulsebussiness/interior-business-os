name: Temporary Organizations Users Formatter
on:
  push:
    branches:
      - feature/organizations-users-cards-ui-20261010
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed Organizations and Users files
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/admin/dashboard-shell.tsx \
            apps/business-app/src/app/admin/organizations/page.tsx \
            apps/business-app/src/app/admin/organizations/create/page.tsx \
            apps/business-app/src/app/admin/organizations/control-actions.ts \
            apps/business-app/src/app/admin/users/create/page.tsx \
            apps/business-app/src/app/admin/users/[id]/page.tsx \
            packages/database/src/platform-companies.ts \
            packages/database/src/generated/database.types.ts \
            docs/ADMIN-ORGANIZATIONS-USERS.md
      - name: Commit style changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/admin/dashboard-shell.tsx \
            apps/business-app/src/app/admin/organizations \
            apps/business-app/src/app/admin/users \
            packages/database/src/platform-companies.ts \
            packages/database/src/generated/database.types.ts \
            docs/ADMIN-ORGANIZATIONS-USERS.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format Organizations & Users cards"
            git push
          fi
