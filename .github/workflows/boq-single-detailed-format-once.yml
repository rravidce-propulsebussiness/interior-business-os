name: Format single Detailed BOQ PR
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/boq-single-detailed-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/boq-single-detailed-view-20261122' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format focused BOQ and final floor prices
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.tsx \
            apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.css \
            apps/business-app/src/app/dashboard/execution/revision-ui.test.ts \
            apps/business-app/src/app/dashboard/execution/layout.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format single Detailed BOQ with floor-wise pricing"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
