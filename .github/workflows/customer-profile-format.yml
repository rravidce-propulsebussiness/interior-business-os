name: Format customer profile feature
on:
  push:
    branches:
      - feature/premium-customer-profile-20261014
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format touched UI files
        run: |
          pnpm exec prettier --write 'apps/business-app/src/app/dashboard/customers/[id]/page.tsx' 'apps/business-app/src/app/dashboard/customers/[id]/customer-profile.css' 'apps/business-app/src/app/dashboard/customers/[id]/reference.tsx' apps/business-app/src/app/dashboard/quotations/new/page.tsx apps/business-app/src/app/dashboard/quotations/studio-start.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/business-app/src/app/dashboard/customers/[id]/page.tsx' 'apps/business-app/src/app/dashboard/customers/[id]/customer-profile.css' 'apps/business-app/src/app/dashboard/customers/[id]/reference.tsx' apps/business-app/src/app/dashboard/quotations/new/page.tsx apps/business-app/src/app/dashboard/quotations/studio-start.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format premium customer profile"
            git push origin HEAD:feature/premium-customer-profile-20261014
          fi
