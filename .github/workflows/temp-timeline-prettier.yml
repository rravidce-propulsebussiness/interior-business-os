name: Temporary construction timeline formatter
on:
  push:
    branches:
      - feature/construction-site-role-timeline-20261015
  pull_request:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format timeline and emit exact source
        run: |
          pnpm exec prettier --write 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx'
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx';
          const source = fs.readFileSync(path,'utf8');
          const pieces = source.match(/[\s\S]{1,600}/g) || [''];
          pieces.forEach((piece,i)=>process.stdout.write('FMTCHUNK|' + path + '|' + i + '|' + pieces.length + '|' + JSON.stringify(piece) + '\n'));
          NODE
