name: Format premium package feature branch
on:
  push:
    branches:
      - feat/premium-package-design-specs-attachments-20261013
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/premium-package-design-specs-attachments-20261013
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Format package-feature source
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/pricing/construction/package-manager.tsx \
            apps/business-app/src/app/dashboard/pricing/construction/package-actions.ts \
            apps/business-app/src/app/dashboard/pricing/construction/premium-package-editor.tsx \
            apps/business-app/src/app/dashboard/pricing/construction/package-attachment-storage.ts \
            apps/business-app/src/app/dashboard/pricing/construction/package-pdf-snapshot.ts \
            "apps/business-app/src/app/dashboard/pricing/construction/packages/[id]/attachment/route.ts" \
            "apps/business-app/src/app/dashboard/pricing/construction/packages/[id]/preview/route.ts" \
            apps/business-app/src/app/dashboard/quotations/construction-actions.ts \
            apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx \
            packages/core/src/sft-quotation.ts \
            packages/core/src/quotation-document.ts \
            packages/core/src/quotation-document.test.ts \
            packages/database/src/construction-packages.ts
      - name: Commit formatted code on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app packages/core/src packages/database/src
          if ! git diff --cached --quiet; then
            git commit -m "style: format premium package builder with repository Prettier"
            git push origin HEAD:feat/premium-package-design-specs-attachments-20261013
          fi
