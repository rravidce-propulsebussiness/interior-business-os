name: Temporary custom-domain formatting
on:
  push:
    branches:
      - feature/cloudflare-saas-custom-domains-20261010
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only custom-domain changes
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/admin/domains/page.tsx \
            apps/business-app/src/app/dashboard/website/cloudflare-domains.test.ts \
            apps/business-app/src/app/dashboard/website/cloudflare-domains.ts \
            apps/business-app/src/app/dashboard/website/domain-actions.ts \
            apps/business-app/src/app/dashboard/website/domain-panel.tsx \
            apps/platform-admin/src/app/dashboard/domains/page.tsx \
            docs/WEBSITE-DOMAINS.md
      - name: Commit formatting only when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/business-app/src/app/admin/domains/page.tsx \
            apps/business-app/src/app/dashboard/website/cloudflare-domains.test.ts \
            apps/business-app/src/app/dashboard/website/cloudflare-domains.ts \
            apps/business-app/src/app/dashboard/website/domain-actions.ts \
            apps/business-app/src/app/dashboard/website/domain-panel.tsx \
            apps/platform-admin/src/app/dashboard/domains/page.tsx \
            docs/WEBSITE-DOMAINS.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format SaaS domain onboarding"
            git push
          fi
