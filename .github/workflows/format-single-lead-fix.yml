name: Format single lead fix
on:
  push:
    branches:
      - fix/one-lead-details-workspace
    paths:
      - .github/workflows/format-single-lead-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed workspace
        run: pnpm exec prettier --write apps/business-app/src/app/dashboard/crm/leads/workspace.tsx
      - name: Commit formatting
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add apps/business-app/src/app/dashboard/crm/leads/workspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Format unified lead workspace"
            git push origin HEAD:fix/one-lead-details-workspace
          fi
