name: Format quotation feature branch
on:
  push:
    branches:
      - feat/quotation-customer-crn-packages-20261013
    paths:
      - .github/workflows/format-quotation-pr70.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/quotation-customer-crn-packages-20261013
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only quotation feature files
        run: |
          pnpm exec prettier --write \
            'apps/business-app/src/app/dashboard/customers/[id]/page.tsx' \
            apps/business-app/src/app/dashboard/quotations/package-actions.ts \
            apps/business-app/src/app/dashboard/quotations/package-manager.tsx \
            apps/business-app/src/app/dashboard/quotations/packages/page.tsx \
            apps/business-app/src/app/dashboard/quotations/page.tsx \
            apps/business-app/src/app/dashboard/quotations/studio-actions.ts \
            apps/business-app/src/app/dashboard/quotations/studio-frame.tsx \
            apps/business-app/src/app/dashboard/quotations/studio-start.tsx \
            apps/business-app/src/app/dashboard/quotations/studio.css \
            packages/database/src/quotation-packages.ts
      - name: Commit formatted feature files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/customers apps/business-app/src/app/dashboard/quotations packages/database/src/quotation-packages.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Format quotation CRN and package manager feature code'
            git push origin HEAD:feat/quotation-customer-crn-packages-20261013
          fi
