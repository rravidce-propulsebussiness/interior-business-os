name: Temporary package specification formatter
on:
  push:
    branches: [fix/boq-existing-package-height-spec]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.ts
          apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.test.ts
          apps/business-app/src/app/dashboard/execution/boq/page.tsx
          apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.ts apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.test.ts apps/business-app/src/app/dashboard/execution/boq/page.tsx apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style: format existing package height compatibility'
            git push
          fi
