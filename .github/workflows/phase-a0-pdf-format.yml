name: Phase A0 one-time PDF formatting
on:
  push:
    branches:
      - fix/phase-a0-rich-pdf-providers-20261010
    paths:
      - .github/workflows/phase-a0-pdf-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only the PDF repair files
        run: |
          pnpm exec prettier --write "packages/shared/src/pdf.ts" "packages/shared/src/pdf.node.ts" "packages/shared/src/pdf.test.ts" "apps/business-app/wrangler.jsonc" "apps/business-app/src/app/dashboard/quotations/[id]/pdf/route.ts" "apps/business-app/src/app/q/[token]/pdf/route.ts" "docs/PDF.md" "docs/BROCHURE-PDF.md"
      - name: Verify repository formatting
        run: pnpm format:check
      - name: Commit format-only changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "packages/shared/src/pdf.ts" "packages/shared/src/pdf.node.ts" "packages/shared/src/pdf.test.ts" "apps/business-app/wrangler.jsonc" "apps/business-app/src/app/dashboard/quotations/[id]/pdf/route.ts" "apps/business-app/src/app/q/[token]/pdf/route.ts" "docs/PDF.md" "docs/BROCHURE-PDF.md"
          git commit -m "style(pdf): apply pinned Prettier to provider adapter and tests"
          git push origin HEAD:fix/phase-a0-rich-pdf-providers-20261010
