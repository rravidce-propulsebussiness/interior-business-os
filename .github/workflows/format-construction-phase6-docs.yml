name: Temporary Phase 6 documentation formatting
on:
  push:
    branches:
      - feature/construction-execution-os-phase6-payment-eligibility-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase6-payment-eligibility-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/CONSTRUCTION-EXECUTION-OS-PHASE6.md
      - name: Commit document formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONSTRUCTION-EXECUTION-OS-PHASE6.md
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format Phase 6 payment documentation"
            git push origin HEAD:feature/construction-execution-os-phase6-payment-eligibility-20261014
          fi
