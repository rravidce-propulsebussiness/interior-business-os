name: Format CRM Board Feature
on:
  push:
    branches:
      - feat/crm-leads-list-board-unified-20261013
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[crm-board-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format CRM changes
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/crm/leads/board-view.tsx \
            apps/business-app/src/app/dashboard/crm/leads/workspace.tsx \
            apps/business-app/src/app/dashboard/crm/leads/page.tsx \
            apps/business-app/src/app/dashboard/crm/leads/leads.css \
            apps/business-app/src/app/dashboard/crm/layout.tsx \
            apps/business-app/src/app/dashboard/crm/pipeline/page.tsx \
            scripts/crm-unified-workspace.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/crm scripts/crm-unified-workspace.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format CRM board feature [crm-board-formatted]"
            git push origin HEAD:feat/crm-leads-list-board-unified-20261013
          fi
