name: Phase A0 dependency lockfile regeneration

# One-time, reviewable branch-only lockfile maintenance; never touches main.
on:
  push:
    branches:
      - fix/phase-a0-dependency-security-20261010
    paths:
      - package.json
      - apps/*/package.json
      - pnpm-workspace.yaml
      - .github/workflows/phase-a0-lockfile.yml

permissions:
  contents: write

concurrency:
  group: phase-a0-lockfile
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Reproduce and regenerate lockfile with pinned pnpm
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Check frozen dependency installation
        run: pnpm install --frozen-lockfile
      - name: Check production dependency audit without exceptions
        run: pnpm audit --prod --audit-level=high
      - name: Preserve security regression for patched braces
        run: pnpm security:dependency
      - name: Commit generated lockfile only to the feature branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore(deps): regenerate verified pnpm lockfile for Phase A0"
          git push origin HEAD:fix/phase-a0-dependency-security-20261010
