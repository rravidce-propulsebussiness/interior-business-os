name: Format BOQ labour feature
on:
  push:
    branches:
      - feat/boq-composite-labour-costing-20261122
    paths:
      - ".github/workflows/boq-labour-temporary-format.yml"
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-labour.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-labour.css
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format permission guard and labour styles"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
