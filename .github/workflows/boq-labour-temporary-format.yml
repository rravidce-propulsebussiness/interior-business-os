name: BOQ labour feature formatting (temporary)
on:
  push:
    branches:
      - feat/boq-composite-labour-costing-20261122
    paths:
      - ".github/workflows/boq-labour-temporary-format.yml"
jobs:
  format-feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format BOQ files
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-actions.ts \
            apps/business-app/src/app/dashboard/execution/boq-export.ts \
            apps/business-app/src/app/dashboard/execution/boq-labour.ts \
            apps/business-app/src/app/dashboard/execution/boq-labour.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-labour-panel.tsx \
            apps/business-app/src/app/dashboard/execution/boq-labour.css \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/layout.tsx
      - name: Commit formatting to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format labour costing feature"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
