name: Validate and generate GST billing types
on:
  push:
    branches:
      - feat/trading-billing-gst-invoices
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: trading_billing_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trading-billing-gst-invoices
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:verify && pnpm db:types
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/trading_billing_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
      - run: pnpm exec prettier --write packages/database/src/generated/database.types.ts packages/database/src/trade-billing.ts apps/business-app/src/app/dashboard/billing apps/business-app/src/app/dashboard/finance/page.tsx apps/business-app/src/app/admin/control/billing/page.tsx
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/generated/database.types.ts packages/database/src/trade-billing.ts apps/business-app/src/app/dashboard/billing apps/business-app/src/app/dashboard/finance/page.tsx apps/business-app/src/app/admin/control/billing/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'chore(billing): generate schema types and format billing screens'
            git push origin HEAD:feat/trading-billing-gst-invoices
          fi
