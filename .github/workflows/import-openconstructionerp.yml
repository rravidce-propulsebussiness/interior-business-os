name: Import OpenConstructionERP

on:
  workflow_dispatch:
    inputs:
      confirm_import:
        description: "Type IMPORT to confirm the full source import"
        required: true
        type: string
  push:
    branches:
      - integration/full-erp-merge
    paths:
      - .github/IMPORT_OPENCONSTRUCTIONERP

permissions:
  contents: write

concurrency:
  group: openconstructionerp-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.ref == 'refs/heads/integration/full-erp-merge' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_import == 'IMPORT')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-erp-merge
          fetch-depth: 0

      - name: Clone the inspected upstream snapshot
        run: |
          git init /tmp/OpenConstructionERP
          git -C /tmp/OpenConstructionERP remote add origin https://github.com/datadrivenconstruction/OpenConstructionERP.git
          git -C /tmp/OpenConstructionERP fetch --depth 1 origin 2d27b866937ea3bd66d3878707b357a3099ba7fa
          git -C /tmp/OpenConstructionERP checkout --detach FETCH_HEAD
          test "$(git -C /tmp/OpenConstructionERP rev-parse HEAD)" = "2d27b866937ea3bd66d3878707b357a3099ba7fa"

      - name: Import complete source tree
        run: |
          test ! -e vendor/openconstructionerp
          mkdir -p vendor/openconstructionerp
          rsync -a --exclude='.git' /tmp/OpenConstructionERP/ vendor/openconstructionerp/
          test -f vendor/openconstructionerp/LICENSE
          test -f vendor/openconstructionerp/NOTICE
          echo "Imported files: $(find vendor/openconstructionerp -type f | wc -l)"

      - name: Commit and push to integration branch
        run: |
          rm -f .github/IMPORT_OPENCONSTRUCTIONERP
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/openconstructionerp .github/IMPORT_OPENCONSTRUCTIONERP
          git commit -m "chore: import OpenConstructionERP source under vendor"
          git push origin HEAD:integration/full-erp-merge
