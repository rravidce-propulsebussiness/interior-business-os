name: Import OpenConstructionERP

on:
  workflow_dispatch:
    inputs:
      confirm_import:
        description: "Type IMPORT to confirm the full source import"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: openconstructionerp-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.ref == 'refs/heads/integration/full-erp-merge' && inputs.confirm_import == 'IMPORT' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/full-erp-merge
          fetch-depth: 0

      - name: Check source repository
        run: |
          git ls-remote https://github.com/datadrivenconstruction/OpenConstructionERP.git refs/heads/main

      - name: Clone upstream source
        run: |
          git clone --depth 1 --branch main https://github.com/datadrivenconstruction/OpenConstructionERP.git /tmp/OpenConstructionERP

      - name: Import complete source tree
        run: |
          test ! -e vendor/openconstructionerp
          mkdir -p vendor/openconstructionerp
          rsync -a --exclude='.git' /tmp/OpenConstructionERP/ vendor/openconstructionerp/
          test -f vendor/openconstructionerp/LICENSE
          test -f vendor/openconstructionerp/NOTICE
          echo "Imported files: $(find vendor/openconstructionerp -type f | wc -l)"

      - name: Commit and push to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/openconstructionerp
          git commit -m "chore: import OpenConstructionERP source under vendor"
          git push origin HEAD:integration/full-erp-merge
