name: Temporary BOQ formatter

on:
  push:
    branches:
      - 'fix/boq-cost-accuracy-20261123'
    paths:
      - '.github/workflows/boq-format-once.yml'

permissions:
  contents: write

jobs:
  format-boq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed BOQ files
        run: >-
          pnpm exec prettier --write
          apps/business-app/src/app/dashboard/execution/boq-pricing.ts
          apps/business-app/src/app/dashboard/execution/boq-pricing.test.ts
          apps/business-app/src/app/dashboard/execution/boq-labour.ts
          apps/business-app/src/app/dashboard/execution/boq-labour.test.ts
          apps/business-app/src/app/dashboard/execution/boq-project-costs.ts
          apps/business-app/src/app/dashboard/execution/boq-project-costs.test.ts
          apps/business-app/src/app/dashboard/execution/boq-actions.ts
          apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
          apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.tsx
          apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.test.tsx
          apps/business-app/src/app/dashboard/execution/boq-compact-fixes.css
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/execution/boq-pricing.ts apps/business-app/src/app/dashboard/execution/boq-pricing.test.ts apps/business-app/src/app/dashboard/execution/boq-labour.ts apps/business-app/src/app/dashboard/execution/boq-labour.test.ts apps/business-app/src/app/dashboard/execution/boq-project-costs.ts apps/business-app/src/app/dashboard/execution/boq-project-costs.test.ts apps/business-app/src/app/dashboard/execution/boq-actions.ts apps/business-app/src/app/dashboard/execution/boq-workspace.tsx apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.tsx apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.test.tsx apps/business-app/src/app/dashboard/execution/boq-compact-fixes.css
          if ! git diff --cached --quiet; then
            git commit -m 'style(boq): format cost integrity implementation'
            git push origin HEAD:fix/boq-cost-accuracy-20261123
          fi
