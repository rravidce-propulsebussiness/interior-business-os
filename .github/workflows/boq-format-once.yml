name: Format BOQ change once (temporary)
on:
  push:
    branches:
      - fix/single-detailed-floor-boq-20261122
    paths:
      - .github/workflows/boq-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/single-detailed-floor-boq-20261122
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only the BOQ files changed in the PR
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-create-step.css \
            apps/business-app/src/app/dashboard/execution/boq-create-step.tsx \
            apps/business-app/src/app/dashboard/execution/boq-create-step.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.css \
            apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.tsx \
            apps/business-app/src/app/dashboard/execution/boq-final-floor-pricing.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.css \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.tsx \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
      - name: Commit formatting to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution/
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): apply Prettier to premium BOQ wizard"
            git push origin HEAD:refs/heads/fix/single-detailed-floor-boq-20261122
          fi
