name: Temporary measured BOQ formatter
on:
  push:
    branches: [fix/boq-measured-finishing]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/app/dashboard/execution/boq-actions.ts
          apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx
          apps/business-app/src/app/dashboard/execution/boq-workspace.tsx
          apps/business-app/src/app/dashboard/execution/boq-cost-summary.test.ts
          packages/core/src/construction-boq.ts
          packages/core/src/construction-boq.test.ts
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/business-app/src/app/dashboard/execution/boq-*.ts apps/business-app/src/app/dashboard/execution/boq-*.tsx packages/core/src/construction-boq*.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style(boq): format measured finishing changes'
            git push
          fi
