name: Verify WhatsApp Calling NOT SET activation (one-time)
on:
  push:
    branches: [fix/wa-calling-not-set-activation]
    paths:
      - .github/workflows/wa-activation-verify-once.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --check
          apps/business-app/src/lib/whatsapp-calling-status.ts
          apps/business-app/src/lib/whatsapp-calling-status.test.ts
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          docs/WHATSAPP-CLOUD-API.md
          vitest.config.ts
      - run: >-
          pnpm exec eslint
          apps/business-app/src/lib/whatsapp-calling-status.ts
          apps/business-app/src/lib/whatsapp-calling-status.test.ts
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          --max-warnings=0
      - run: >-
          pnpm exec vitest run
          apps/business-app/src/lib/whatsapp-calling-status.test.ts
          apps/business-app/src/lib/whatsapp-calling-permission.test.ts
          apps/business-app/src/lib/whatsapp-calling-events.test.ts
          apps/business-app/src/lib/whatsapp-turn.test.ts
      - run: pnpm --filter ./apps/business-app build
      - run: pnpm build && pnpm security:secrets
