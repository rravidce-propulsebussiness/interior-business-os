name: Temporary BOQ format pass
on:
  push:
    branches:
      - fix/boq-plaster-coats-wastage-columns-20261123
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed BOQ code and tests
        run: |
          pnpm exec prettier --write \
            packages/core/src/construction-boq.ts \
            packages/core/src/construction-boq.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-actions.ts \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.tsx \
            apps/business-app/src/app/dashboard/execution/boq-wizard-flow.test.tsx \
            apps/business-app/src/app/dashboard/execution/boq-plaster-guards.ts \
            apps/business-app/src/app/dashboard/execution/boq-plaster-guards.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/execution
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): format plaster and structural estimate changes"
            git push origin HEAD:fix/boq-plaster-coats-wastage-columns-20261123
          fi
