name: Temporary quote handoff format capture
on:
  push:
    branches:
      - feature/quote-driven-construction-handoff-20261015
  pull_request:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format source and emit exact fragments
        run: |
          pnpm exec prettier --write 'apps/business-app/src/app/dashboard/finance/[entity]/[id]/page.tsx' 'apps/business-app/src/app/dashboard/finance/actions.ts' 'apps/business-app/src/app/dashboard/finance/handoff.tsx' 'apps/business-app/src/app/dashboard/finance/quote-construction-handoff.ts' 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-actions.ts' 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx' 'apps/business-app/src/app/dashboard/projects/[id]/site/construction-planning-panel.tsx' 'docs/QUOTE-TO-CONSTRUCTION-TIMELINE.md' 'packages/core/src/quote-construction-handoff.test.ts' 'packages/core/src/quote-construction-handoff.ts'
          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ["apps/business-app/src/app/dashboard/finance/[entity]/[id]/page.tsx","apps/business-app/src/app/dashboard/finance/actions.ts","apps/business-app/src/app/dashboard/finance/handoff.tsx","apps/business-app/src/app/dashboard/finance/quote-construction-handoff.ts","apps/business-app/src/app/dashboard/projects/[id]/site/construction-actions.ts","apps/business-app/src/app/dashboard/projects/[id]/site/construction-journey.tsx","apps/business-app/src/app/dashboard/projects/[id]/site/construction-planning-panel.tsx","docs/QUOTE-TO-CONSTRUCTION-TIMELINE.md","packages/core/src/quote-construction-handoff.test.ts","packages/core/src/quote-construction-handoff.ts"]) {
            const source = fs.readFileSync(path,'utf8');
            const parts = source.match(/[\s\S]{1,600}/g) || [''];
            for(let i=0;i<parts.length;i++)
              process.stdout.write('FMTCHUNK|' + path + '|' + i + '|' + parts.length + '|' + JSON.stringify(parts[i]) + '\n');
          }
          NODE
