name: Temporary quote timeline types diff
on:
  push:
    branches: [feature/quote-driven-construction-handoff-20261015]
  pull_request:
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: business_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate and print exact types delta
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/business_os_test
          ALLOW_TEST_DATABASE_RESET: 'yes'
        run: |
          pnpm db:verify --initialize-only >/tmp/init.log
          pnpm db:types
          git diff -- packages/database/src/generated/database.types.ts || true
