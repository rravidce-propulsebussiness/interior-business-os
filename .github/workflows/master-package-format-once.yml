name: Format master package implementation once

on:
  push:
    paths:
      - .github/workflows/master-package-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier conventions
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/admin/control/quotations/master-actions.ts \
            apps/business-app/src/app/admin/control/quotations/master-packages.tsx \
            apps/business-app/src/app/admin/control/quotations/master-packages.css \
            apps/business-app/src/app/admin/control/quotations/page.tsx \
            packages/database/src/generated/database.types.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/admin/control/quotations/master-actions.ts \
            apps/business-app/src/app/admin/control/quotations/master-packages.tsx \
            apps/business-app/src/app/admin/control/quotations/master-packages.css \
            apps/business-app/src/app/admin/control/quotations/page.tsx \
            packages/database/src/generated/database.types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(quotations): format master package implementation"
            git push origin HEAD:main
          fi
