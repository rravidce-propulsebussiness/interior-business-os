name: WhatsApp calling preview formatter (one-time)
on:
  push:
    branches: [feature/whatsapp-voice-calling]
    paths:
      - .github/workflows/wa-calling-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/business-app/src/lib/whatsapp-calling-permission.ts
          apps/business-app/src/lib/whatsapp-calling-permission.test.ts
          apps/business-app/src/app/api/whatsapp/calling/route.ts
          apps/business-app/src/app/dashboard/whatsapp/calling.tsx
          apps/business-app/src/app/dashboard/whatsapp/hub.tsx
      - run: |
          if ! git diff --quiet -- apps/business-app/src/lib/whatsapp-calling-permission.ts apps/business-app/src/lib/whatsapp-calling-permission.test.ts apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx apps/business-app/src/app/dashboard/whatsapp/hub.tsx; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add apps/business-app/src/lib/whatsapp-calling-permission.ts apps/business-app/src/lib/whatsapp-calling-permission.test.ts apps/business-app/src/app/api/whatsapp/calling/route.ts apps/business-app/src/app/dashboard/whatsapp/calling.tsx apps/business-app/src/app/dashboard/whatsapp/hub.tsx
            git commit -m "Format WhatsApp calling integration"
            git push origin HEAD:feature/whatsapp-voice-calling
          fi
# Round 2: format call lifecycle fixes before verification.
