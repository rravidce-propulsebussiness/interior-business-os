name: Business app typecheck and build
on:
  push:
    paths:
      - 'apps/business-app/src/app/client/**'
      - 'apps/business-app/src/app/dashboard/crm/**'
      - 'apps/business-app/src/app/dashboard/leads-navigation.ts'
      - 'apps/business-app/src/app/dashboard/quotations/**'
      - 'apps/business-app/src/app/dashboard/billing/**'
      - 'apps/business-app/next.config.ts'
      - 'scripts/hostinger-build.mjs'
      - 'server.js'
      - '.github/workflows/client-app-check.yml'
  pull_request:
    paths:
      - 'apps/business-app/src/app/client/**'
      - 'apps/business-app/src/app/dashboard/crm/**'
      - 'apps/business-app/src/app/dashboard/leads-navigation.ts'
      - 'apps/business-app/src/app/dashboard/quotations/**'
      - 'apps/business-app/src/app/dashboard/billing/**'
      - 'apps/business-app/next.config.ts'
      - 'scripts/hostinger-build.mjs'
      - 'server.js'
      - '.github/workflows/client-app-check.yml'
permissions:
  contents: read
jobs:
  business-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/core/src/custom-brand-quote.test.ts apps/business-app/src/app/dashboard/quotations/studio-ui.test.ts apps/business-app/src/app/dashboard/billing/billing-ui.test.ts apps/business-app/src/app/dashboard/billing/labour/labour.test.ts
      - run: pnpm --filter @business-os/business-app typecheck
      - run: pnpm --filter @business-os/business-app build


