name: One-time format SG brochure package changes
on:
  push:
    branches:
      - feat/sg-brochure-32-spec-packages-20261121
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sg-brochure-32-spec-packages-20261121
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/pricing/construction/premium-package-editor.tsx apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.test.ts
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts apps/business-app/src/app/dashboard/pricing/construction/premium-package-editor.tsx apps/business-app/src/app/dashboard/pricing/construction/floor-rate-rules.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format SG brochure BOQ and package regression changes"
            git push origin HEAD:feat/sg-brochure-32-spec-packages-20261121
          fi
