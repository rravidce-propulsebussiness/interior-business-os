name: Temporary Phase 8 final JSX formatting
on:
  push:
    branches:
      - feature/construction-execution-os-phase8-next-day-planner-20261014
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/construction-execution-os-phase8-next-day-planner-20261014
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/business-app/src/app/dashboard/projects/[id]/site/construction-tomorrow-panel.tsx" "apps/business-app/src/app/dashboard/projects/[id]/site/construction-tomorrow-actions.ts"
      - name: Commit the pinned formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/business-app/src/app/dashboard/projects/[id]/site/construction-tomorrow-panel.tsx" "apps/business-app/src/app/dashboard/projects/[id]/site/construction-tomorrow-actions.ts"
          if ! git diff --cached --quiet; then
            git commit -m "style(construction): format final planner labels"
            git push origin HEAD:feature/construction-execution-os-phase8-next-day-planner-20261014
          fi
