name: Format ProPulse company branch
on:
  push:
    branches:
      - feature/propulse-company-owner-sync-20261013
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed TypeScript and scripts
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/auth/provider-start.ts \
            apps/business-app/src/app/auth/callback/route.ts \
            apps/business-app/src/app/auth/propulse-company-sync.ts \
            apps/business-app/src/app/dashboard/page.tsx \
            apps/business-app/src/app/dashboard/company/settings/page.tsx \
            packages/database/src/generated/database.types.ts \
            packages/database/scripts/test.mjs \
            packages/database/scripts/verify.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              apps/business-app/src/app/auth/provider-start.ts \
              apps/business-app/src/app/auth/callback/route.ts \
              apps/business-app/src/app/auth/propulse-company-sync.ts \
              apps/business-app/src/app/dashboard/page.tsx \
              apps/business-app/src/app/dashboard/company/settings/page.tsx \
              packages/database/src/generated/database.types.ts \
              packages/database/scripts/test.mjs \
              packages/database/scripts/verify.mjs
            git commit -m "style: format ProPulse company sync integration"
            git push origin HEAD:feature/propulse-company-owner-sync-20261013
          fi
