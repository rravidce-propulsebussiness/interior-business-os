name: Format ProPulse company branch
on:
  push:
    branches:
      - feature/propulse-owner-company-auto-sync-20261013
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed Business OS sources
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/auth/callback/route.ts \
            apps/business-app/src/app/auth/callback/propulse-company-sync.ts \
            apps/business-app/src/app/dashboard/page.tsx \
            apps/business-app/src/app/dashboard/company/settings/page.tsx \
            apps/business-app/src/app/dashboard/company/apply/page.tsx \
            apps/business-app/src/app/dashboard/company/invitations/page.tsx \
            packages/database/src/repository.ts \
            packages/database/src/generated/database.types.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              apps/business-app/src/app/auth/callback/route.ts \
              apps/business-app/src/app/auth/callback/propulse-company-sync.ts \
              apps/business-app/src/app/dashboard/page.tsx \
              apps/business-app/src/app/dashboard/company/settings/page.tsx \
              apps/business-app/src/app/dashboard/company/apply/page.tsx \
              apps/business-app/src/app/dashboard/company/invitations/page.tsx \
              packages/database/src/repository.ts \
              packages/database/src/generated/database.types.ts
            git commit -m "style: format ProPulse company sync code"
            git push origin HEAD:feature/propulse-owner-company-auto-sync-20261013
          fi
