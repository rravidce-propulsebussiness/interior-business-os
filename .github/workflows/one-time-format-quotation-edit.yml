name: One-time format quotation edit fix
on:
  push:
    branches:
      - fix/quotation-saved-edit-single-material-20261121
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quotation-saved-edit-single-material-20261121
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/business-app/src/app/dashboard/quotations/construction-package-selection.ts apps/business-app/src/app/dashboard/quotations/construction-package-selection.test.ts apps/business-app/src/app/dashboard/quotations/construction-selector.tsx apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx apps/business-app/src/app/dashboard/quotations/construction-actions.ts 'apps/business-app/src/app/dashboard/quotations/[id]/studio/page.tsx' apps/business-app/src/app/dashboard/quotations/studio-ui.test.ts apps/business-app/src/app/dashboard/quotations/quotation-editor-regressions.test.ts
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/business-app/src/app/dashboard/quotations/construction-package-selection.ts apps/business-app/src/app/dashboard/quotations/construction-package-selection.test.ts apps/business-app/src/app/dashboard/quotations/construction-selector.tsx apps/business-app/src/app/dashboard/quotations/premium-sft-builder.tsx apps/business-app/src/app/dashboard/quotations/construction-actions.ts 'apps/business-app/src/app/dashboard/quotations/[id]/studio/page.tsx' apps/business-app/src/app/dashboard/quotations/studio-ui.test.ts apps/business-app/src/app/dashboard/quotations/quotation-editor-regressions.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format saved quotation editor and regression tests"
            git push origin HEAD:fix/quotation-saved-edit-single-material-20261121
          fi
