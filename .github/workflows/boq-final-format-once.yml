name: Final formatting for BOQ focused editor
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/boq-final-format-once.yml"]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/boq-focused-work-edit-and-floor-scopes-20261122' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed BOQ files
        run: |
          pnpm exec prettier --write \
            apps/business-app/src/app/dashboard/execution/boq-actions.ts \
            apps/business-app/src/app/dashboard/execution/boq-floor-scopes.ts \
            apps/business-app/src/app/dashboard/execution/boq-floor-scopes.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.tsx \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.css \
            apps/business-app/src/app/dashboard/execution/boq-stage-builder.test.ts \
            apps/business-app/src/app/dashboard/execution/boq-workspace.tsx \
            packages/core/src/construction-boq.ts \
            packages/core/src/construction-boq.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/business-app/src/app/dashboard/execution packages/core/src/construction-boq.ts packages/core/src/construction-boq.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(boq): final Prettier for per-floor BOQ editor"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
