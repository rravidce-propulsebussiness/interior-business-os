name: Format Single-Domain Admin Draft
on:
  push:
    branches:
      - feat/single-domain-super-admin-20261010
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'rravidce-propulsebussiness/interior-business-os'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only the integrated admin and documentation
        run: |
          pnpm exec prettier --write 'apps/business-app/src/app/admin/**/*.{ts,tsx,css}' \
            'apps/business-app/src/app/dashboard/page.tsx' \
            docs/HOSTINGER-DEPLOYMENT.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/business-app/src/app/admin apps/business-app/src/app/dashboard/page.tsx docs/HOSTINGER-DEPLOYMENT.md
          if ! git diff --cached --quiet; then
            git commit -m "style(business-os): format integrated admin"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
